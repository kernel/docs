overlay: 1.0.0
info:
  title: Hide internal Search API endpoints from the public reference
  version: 1.0.0
extends: https://api.onkernel.com/spec.json
actions:
  - target: $.paths['/search']
    remove: true
  - target: $.paths['/search/{id}']
    remove: true
  - target: $.paths['/search/{id}/contents']
    remove: true
  - target: $.paths['/search/providers']
    remove: true
