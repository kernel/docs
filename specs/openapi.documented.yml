    get:
      operationId: getBrowsers
      tags:
        - Browsers
      summary: List browser sessions
      description: List all browser sessions with pagination support. Use status parameter to filter by session state.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter sessions by status. "active" returns only active sessions (default), "deleted" returns only soft-deleted sessions, "all" returns both.
          schema:
            type: string
            enum:
              - active
              - deleted
              - all
            default: active
        - name: include_deleted
          in: query
          required: false
          deprecated: true
          description: 'Deprecated: Use status=all instead. When true, includes soft-deleted browser sessions in the results alongside active sessions.'
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return. Defaults to 20, maximum 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          description: Number of results to skip. Defaults to 0.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: query
          in: query
          required: false
          description: Search browsers by name, session ID, profile name or ID, proxy ID, or pool name.
          schema:
            type: string
        - name: tags
          in: query
          required: false
          style: deepObject
          explode: true
          description: |
            Filter sessions by tag key-value pairs using deepObject style, e.g. ?tags[team]=backend&tags[env]=staging. Multiple pairs are ANDed: a session must match every supplied pair exactly.
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        "200":
          description: List of browsers
          headers:
            X-Limit:
              description: The limit used for pagination
              schema:
                type: integer
            X-Offset:
              description: The offset used for pagination
              schema:
                type: integer
            X-Has-More:
              description: Whether more results are available
              schema:
                type: boolean
            X-Next-Offset:
              description: The offset where the next page starts. 0 when there are no more results.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Browser'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Kernel from '@onkernel/sdk';

            const client = new Kernel({
              apiKey: process.env['KERNEL_API_KEY'], // This is the default and can be omitted
            });

            // Automatically fetches more pages as needed.
            for await (const browserListResponse of client.browsers.list()) {
              console.log(browserListResponse.session_id);
            }
        - lang: Python
          source: |-
            import os
            from kernel import Kernel

            client = Kernel(
                api_key=os.environ.get("KERNEL_API_KEY"),  # This is the default and can be omitted
            )
            page = client.browsers.list()
            page = page.items[0]
            print(page.session_id)
        - lang: Go
          source: |
            package main

            import (
            	"context"
            	"fmt"

            	"github.com/kernel/kernel-go-sdk"
            	"github.com/kernel/kernel-go-sdk/option"
            )

            func main() {
            	client := kernel.NewClient(
            		option.WithAPIKey("My API Key"),
            	)
            	page, err := client.Browsers.List(context.TODO(), kernel.BrowserListParams{})
            	if err != nil {
            		panic(err.Error())
            	}
            	fmt.Printf("%+v\n", page)
            }
