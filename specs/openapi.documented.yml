    get:
      x-hidden: false
      operationId: getInvocationsEventsById
      tags:
        - Invocations
      summary: Stream invocation events via SSE
      description: |
        Establishes a Server-Sent Events (SSE) stream that delivers real-time logs and
        status updates for an invocation. The stream terminates automatically
        once the invocation reaches a terminal state.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The invocation ID to follow.
          schema:
            type: string
        - name: since
          in: query
          required: false
          description: Show logs since the given time (RFC timestamps or durations like 5m).
          schema:
            type: string
            example: "2025-06-20T12:00:00Z"
      responses:
        "200":
          description: SSE stream of invocation state updates and logs.
          headers:
            X-SSE-Content-Type:
              description: Media type of SSE data events (always application/json).
              schema:
                type: string
                const: application/json
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/InvocationEvent'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Kernel from '@onkernel/sdk';

            const client = new Kernel({
              apiKey: process.env['KERNEL_API_KEY'], // This is the default and can be omitted
            });

            const response = await client.invocations.follow('id');

            console.log(response);
        - lang: Python
          source: |-
            import os
            from kernel import Kernel

            client = Kernel(
                api_key=os.environ.get("KERNEL_API_KEY"),  # This is the default and can be omitted
            )
            for invocation in client.invocations.follow(
                id="id",
            ):
              print(invocation)
        - lang: Go
          source: |
            package main

            import (
            	"context"
            	"fmt"

            	"github.com/kernel/kernel-go-sdk"
            	"github.com/kernel/kernel-go-sdk/option"
            )

            func main() {
            	client := kernel.NewClient(
            		option.WithAPIKey("My API Key"),
            	)
            	stream := client.Invocations.FollowStreaming(
            		context.TODO(),
            		"id",
            		kernel.InvocationFollowParams{},
            	)
            	for stream.Next() {
            		fmt.Printf("%+v\n", stream.Current())
            	}
            	err := stream.Err()
            	if err != nil {
            		panic(err.Error())
            	}
            }
