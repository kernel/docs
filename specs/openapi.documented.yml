    get:
      operationId: listApiKeys
      tags:
        - API Keys
      summary: List API keys
      description: List API keys for the authenticated organization. API keys are masked.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
          description: Maximum number of results to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Number of results to skip
        - name: query
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive substring match against API key name, creator, and project. API key identifiers and masked keys match by exact value or prefix.
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Exact-match filter on API key name using the database collation. In production, matching is case- and accent-insensitive. Names are not required to be unique, so multiple keys may match. When status=all or include_deleted=true is set, soft-deleted keys with the same name may also match.
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - created_at
              - name
              - expires_at
            default: created_at
          description: Field to sort API keys by.
        - name: sort_direction
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sort direction for API keys.
        - name: status
          in: query
          required: false
          description: Filter API keys by status. "active" returns keys that are not deleted (default; expired-but-not-deleted keys are still included), "deleted" returns only soft-deleted keys, "all" returns both.
          schema:
            type: string
            enum:
              - active
              - deleted
              - all
            default: active
        - name: include_deleted
          in: query
          required: false
          deprecated: true
          description: 'Deprecated: use status=all instead. When true, include deleted (soft-deleted) API keys in the results for audit purposes.'
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of API keys
          headers:
            X-Has-More:
              schema:
                type: boolean
              description: Whether there are more results
            X-Next-Offset:
              schema:
                type: integer
              description: The offset where the next page starts. 0 when there are no more results.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKey'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "500":
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Kernel from '@onkernel/sdk';

            const client = new Kernel({
              apiKey: process.env['KERNEL_API_KEY'], // This is the default and can be omitted
            });

            // Automatically fetches more pages as needed.
            for await (const apiKey of client.apiKeys.list()) {
              console.log(apiKey.id);
            }
        - lang: Python
          source: |-
            import os
            from kernel import Kernel

            client = Kernel(
                api_key=os.environ.get("KERNEL_API_KEY"),  # This is the default and can be omitted
            )
            page = client.api_keys.list()
            page = page.items[0]
            print(page.id)
        - lang: Go
          source: |
            package main

            import (
            	"context"
            	"fmt"

            	"github.com/kernel/kernel-go-sdk"
            	"github.com/kernel/kernel-go-sdk/option"
            )

            func main() {
            	client := kernel.NewClient(
            		option.WithAPIKey("My API Key"),
            	)
            	page, err := client.APIKeys.List(context.TODO(), kernel.APIKeyListParams{})
            	if err != nil {
            		panic(err.Error())
            	}
            	fmt.Printf("%+v\n", page)
            }
