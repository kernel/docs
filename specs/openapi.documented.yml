        - lang: JavaScript
          source: |-
            import Kernel from '@onkernel/sdk';

            const client = new Kernel({
              apiKey: process.env['KERNEL_API_KEY'], // This is the default and can be omitted
            });

            const response = await client.browsers.fs.watch.events('watch_id', { id: 'id' });

            console.log(response.path);
        - lang: Python
          source: |-
            import os
            from kernel import Kernel

            client = Kernel(
                api_key=os.environ.get("KERNEL_API_KEY"),  # This is the default and can be omitted
            )
            for watch in client.browsers.fs.watch.events(
                watch_id="watch_id",
                id="id",
            ):
              print(watch)
        - lang: Go
          source: |
            package main

            import (
            	"context"
            	"fmt"

            	"github.com/kernel/kernel-go-sdk"
            	"github.com/kernel/kernel-go-sdk/option"
            )

            func main() {
            	client := kernel.NewClient(
            		option.WithAPIKey("My API Key"),
            	)
            	stream := client.Browsers.Fs.Watch.EventsStreaming(
            		context.TODO(),
            		"watch_id",
            		kernel.BrowserFWatchEventsParams{
            			ID: "id",
            		},
            	)
            	for stream.Next() {
            		fmt.Printf("%+v\n", stream.Current())
            	}
            	err := stream.Err()
            	if err != nil {
            		panic(err.Error())
            	}
            }
