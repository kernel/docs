    UpdateAuditLogExportDestinationRequest:
      type: object
      properties:
        region:
          type: string
          minLength: 1
          maxLength: 128
        bucket:
          type: string
          minLength: 3
          maxLength: 63
        prefix:
          type: string
          maxLength: 512
        role_arn:
          type: string
          minLength: 1
          maxLength: 2048
        kms_key_id:
          type: string
