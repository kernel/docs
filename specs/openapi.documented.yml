  /audit-logs:
    get:
      operationId: getAuditLogs
      tags:
        - Audit Logs
      summary: List audit logs
      description: API for searching audit logs. Limited to at most 30 day search, returns up to 100 records per page. Not recommended for bulk export.
      security:
        - bearerAuth: []
      parameters:
        - name: start
          in: query
          required: true
          description: Lower bound (inclusive) for the audit record timestamp.
          schema:
            type: string
            format: date-time
            example: "2026-01-01T00:00:00Z"
        - name: end
          in: query
          required: true
          description: Upper bound (exclusive) for the audit record timestamp.
          schema:
            type: string
            format: date-time
            example: "2026-01-02T00:00:00Z"
        - name: auth_strategy
          in: query
          required: false
          description: Filter by authentication strategy.
          schema:
            type: string
        - name: service
          in: query
          required: false
          description: Filter by service name.
          schema:
            type: string
        - name: method
          in: query
          required: false
          description: Filter by HTTP method.
          schema:
            type: string
        - name: exclude_method
          in: query
          required: false
          description: Filter out results by HTTP method.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 10
            items:
              type: string
        - name: search
          in: query
          required: false
          description: Free-text search over path, user ID, email, client IP, and status.
          schema:
            type: string
        - name: search_user_id
          in: query
          required: false
          description: Additional user IDs to OR into free-text search.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: page_token
          in: query
          required: false
          description: Opaque page token from X-Next-Page-Token for the next page of older records.
          schema:
            type: string
      responses:
        "200":
          description: A list of audit log records.
          headers:
            X-Limit:
              description: The limit applied to the returned records.
              schema:
                type: integer
                minimum: 1
                maximum: 100
            X-Next-Page-Token:
              description: Page token for the next page of older records, omitted when no more results.
              schema:
                type: string
            X-Has-More:
              description: Whether there are more records available beyond this page.
              schema:
                type: boolean
                default: false
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
