  /browsers/{id}/telemetry/events:
    get:
      summary: Read telemetry events for a browser session
      description: |
        Reads a page of telemetry events for the browser session. To page through results, pass the X-Next-Offset value from the previous response as offset and repeat while X-Has-More is true. Returns an empty list when telemetry data is unavailable.
      operationId: readBrowserTelemetryEvents
      tags:
        - Browser Telemetry
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Browser session ID
        - name: offset
          in: query
          required: false
          description: |
            Opaque pagination cursor: pass the X-Next-Offset value from the previous response to fetch the next page. When set, paging continues from this cursor and since is ignored, while until still bounds the page. It is not an event's seq field, so do not derive it from the response body.
          schema:
            type: integer
            minimum: 0
        - name: since
          in: query
          required: false
          description: |
            Start of the window: an RFC-3339 timestamp, or a duration like 5m meaning that long ago. Defaults to 5m. Ignored when offset is set.
          schema:
            type: string
        - name: until
          in: query
          required: false
          description: |
            End of the window (exclusive): an RFC-3339 timestamp, or a duration like 5m meaning that long ago.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of events per page. Defaults to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: category
          in: query
          required: false
          description: Restrict results to these event categories. Repeat the parameter for multiple values.
          schema:
            type: array
            items:
              type: string
              enum:
                - console
                - network
                - page
                - interaction
                - control
                - connection
                - system
                - screenshot
                - captcha
                - monitor
        - name: order
          in: query
          required: false
          description: |
            Read direction. asc (default) reads oldest first, starting from since or the offset cursor. desc reads newest first: each request returns one page of up to limit records ending at the offset cursor (or until, or the newest archived event); combining desc with since is rejected with a 400. In either direction the category filter applies within the page, so a filtered page may be empty while X-Has-More is true.
          schema:
            type: string
            default: asc
      responses:
        "200":
          description: A page of telemetry events.
          headers:
            X-Has-More:
              description: Whether more results are available
              schema:
                type: boolean
            X-Next-Offset:
              description: The offset where the next page starts. 0 when there are no more results.
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BrowserTelemetryEventEnvelope'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: JavaScript
          source: |-
            import Kernel from '@onkernel/sdk';

            const client = new Kernel({
              apiKey: process.env['KERNEL_API_KEY'], // This is the default and can be omitted
            });

            // Automatically fetches more pages as needed.
            for await (const telemetryEventsResponse of client.browsers.telemetry.events('id')) {
              console.log(telemetryEventsResponse.event);
            }
        - lang: Python
          source: |-
            import os
            from kernel import Kernel

            client = Kernel(
                api_key=os.environ.get("KERNEL_API_KEY"),  # This is the default and can be omitted
            )
            page = client.browsers.telemetry.events(
                id="id",
            )
            page = page.items[0]
            print(page.event)
        - lang: Go
          source: |
            package main

            import (
            	"context"
            	"fmt"

            	"github.com/kernel/kernel-go-sdk"
            	"github.com/kernel/kernel-go-sdk/option"
            )

            func main() {
            	client := kernel.NewClient(
            		option.WithAPIKey("My API Key"),
            	)
            	page, err := client.Browsers.Telemetry.Events(
            		context.TODO(),
            		"id",
            		kernel.BrowserTelemetryEventsParams{},
            	)
            	if err != nil {
            		panic(err.Error())
            	}
            	fmt.Printf("%+v\n", page)
            }
