          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: monitor_init_failed
        category:
          type: string
          const: monitor
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          properties:
            step:
              type: string
              description: The CDP method or initialization step that failed (e.g. Target.setAutoAttach).
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserApiCallEvent:
      type: object
      description: An agent-driven HTTP call handled by the in-VM API server.
      required:
        - ts
        - type
        - category
        - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: api_call
        category:
          type: string
          const: control
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
            - request_id
            - operation_id
            - status
            - duration_ms
          properties:
            request_id:
              type: string
              description: Per-request identifier from the in-VM API request middleware.
            operation_id:
              type: string
              description: OpenAPI operationId of the matched route (e.g. processExec, takeScreenshot).
            status:
              type: integer
              description: HTTP response status code.
            duration_ms:
              type: number
              description: Wall-clock duration of the handler in milliseconds.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserCdpConnectEvent:
      type: object
      description: An external client (e.g. customer SDK, Playwright, Puppeteer) connected to the CDP WebSocket proxy on this VM.
      required:
        - ts
        - type
        - category
        - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: cdp_connect
        category:
          type: string
          const: connection
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserCdpDisconnectEvent:
      type: object
      description: An external client disconnected from the CDP WebSocket proxy on this VM. Pair with the immediately preceding cdp_connect on the same stream.
      required:
        - ts
        - type
        - category
        - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: cdp_disconnect
        category:
          type: string
          const: connection
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
            - duration_ms
            - message_count
            - reason
          properties:
            duration_ms:
              type: number
              description: Wall-clock duration of the connection in milliseconds.
            message_count:
              type: integer
              description: Number of CDP messages relayed across the connection in either direction.
            reason:
              type: string
              x-go-type: string
              description: 'Why the connection ended. client_close: the client initiated the close. upstream_changed: Chromium restarted mid-session and the proxy tore down so the client could reconnect against the new upstream. upstream_error: upstream dial or message pump errored. context_cancelled: the request context was cancelled (typically server shutdown).'
              enum:
                - client_close
                - upstream_changed
                - upstream_error
                - context_cancelled
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserLiveViewConnectEvent:
      type: object
      description: A live view client connected to the headful browser's WebRTC server. Headful only; not emitted for headless images.
      required:
        - ts
        - type
        - category
        - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: live_view_connect
        category:
          type: string
          const: connection
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
            - session_id
          properties:
            session_id:
              type: string
              description: Live view session identifier. Stable across reconnects, so a transient network blip can emit two events with the same session_id.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserLiveViewDisconnectEvent:
      type: object
      description: A live view client disconnected from the headful browser's WebRTC server. Pair with live_view_connect by session_id.
      required:
        - ts
        - type
        - category
        - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: live_view_disconnect
        category:
          type: string
          const: connection
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
            - session_id
            - duration_ms
          properties:
            session_id:
              type: string
              description: Live view session identifier; matches the corresponding live_view_connect event.
            duration_ms:
              type: number
              description: Wall-clock duration of the connection in milliseconds.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserCaptchaSolveResultEvent:
      type: object
      description: A captcha solve attempt reached a terminal outcome.
      required:
        - ts
        - type
        - category
        - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: captcha_solve_result
        category:
          type: string
          const: captcha
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
            - captcha_type
            - status
            - duration_ms
          properties:
            captcha_type:
              type: string
              x-go-type: string
              description: Captcha vendor family. Provider-specific task names are normalized into this set; anything not covered is reported as other.
              enum:
                - hcaptcha
                - recaptcha_v2
                - recaptcha_v3
                - turnstile
                - geetest
                - other
            status:
              type: string
              x-go-type: string
              description: 'Terminal outcome. success: solver returned a usable solution. failure: solver returned an error (see error_code). timeout: solver did not return within the caller''s wait budget. abandoned: caller cancelled or the page navigated away mid-solve.'
              enum:
                - success
                - failure
                - timeout
                - abandoned
            duration_ms:
              type: number
              description: Wall-clock duration from solve start to terminal outcome.
            task_id:
              type: string
              description: Solver-assigned identifier. Opaque, useful for support cross-references.
            website_host:
              type: string
              description: Host of the page where the captcha was solved.
            website_path:
              type: string
              description: Path of the page where the captcha was solved. Query string excluded.
            error_code:
              type: string
              description: Solver-specific error code on failure (e.g. ERROR_CAPTCHA_UNSOLVABLE). Absent on success.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserSystemOomKillEvent:
      type: object
      description: The Linux kernel OOM-killer terminated a process inside the VM. Fires for any process killed by the kernel due to memory exhaustion, including Chrome renderer subprocesses that are not supervised.
      required:
        - ts
        - type
        - category
        - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: system_oom_kill
        category:
          type: string
          const: system
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
            - process_name
            - pid
            - rss_kb
          properties:
            process_name:
              type: string
              description: Comm of the killed process as reported by the kernel (max 15 chars, truncated by the kernel).
            pid:
              type: integer
              description: PID of the killed process.
            rss_kb:
              type: integer
              description: Resident set size of the killed process in KiB (sum of anon-rss, file-rss, and shmem-rss).
            trigger_process_name:
              type: string
              description: Comm of the process whose allocation request caused the kernel to invoke the OOM-killer. Often the same as process_name but can differ. Max 15 chars.
            trigger_pid:
              type: integer
              description: PID of the triggering process. Absent if the kernel did not emit the standard header line.
            constraint:
              type: string
              x-go-type: string
              description: Why the kernel decided to OOM-kill. none means global memory exhaustion; memcg means a cgroup memory limit was hit; cpuset / memory_policy are NUMA/policy-driven kills. Absent on kernels older than 5.0.
              enum:
                - none
                - memcg
                - cpuset
                - memory_policy
            mem_total_kb:
              type: integer
              description: Total system memory in KiB at the time of the kill. Assumes a 4 KiB page size. Absent if the kernel did not emit a parseable Mem-Info section.
            mem_free_kb:
              type: integer
              description: Free system memory in KiB at the time of the kill. Assumes a 4 KiB page size. Does not include reclaimable caches. Absent if the kernel did not emit a parseable Mem-Info section.
            top_tasks:
              type: array
              maxItems: 5
              description: Top processes by resident-set-size at the moment of the kill, sorted descending. Empty if the kernel did not emit the Tasks state table. Capped at 5 entries.
              items:
                type: object
                additionalProperties: false
                required:
                  - pid
                  - name
                  - rss_kb
                properties:
                  pid:
                    type: integer
                    description: PID of the process.
                  name:
                    type: string
                    description: Comm of the process (max 15 chars, truncated by the kernel).
                  rss_kb:
                    type: integer
                    description: Resident set size in KiB at the moment of the kill.
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserServiceCrashedEvent:
      type: object
      description: A managed service exited unexpectedly. Intentional stops do not produce this event; only unexpected exits and terminal restart-give-up transitions do.
      required:
        - ts
        - type
        - category
        - source
      properties:
        ts:
          type: integer
          format: int64
          description: Event timestamp in Unix microseconds.
        type:
          type: string
          const: service_crashed
        category:
          type: string
          const: system
        source:
          $ref: '#/components/schemas/BrowserEventSource'
        data:
          type: object
          additionalProperties: false
          required:
            - service_name
            - phase
          properties:
            service_name:
              type: string
              description: Program name of the crashed service (e.g. chromium, mutter, kernel-images-api).
            pid:
              type: integer
              description: PID of the crashed process. Absent when the process manager gave up after exhausting restart attempts.
            phase:
              type: string
              x-go-type: string
              description: 'Lifecycle phase the crash occurred in. startup: the process died before reaching a healthy running state. running: a previously healthy process died unexpectedly. gave_up: the process manager exhausted its restart attempts and stopped trying.'
              enum:
                - startup
                - running
                - gave_up
        truncated:
          type: boolean
          description: True if the data field was truncated due to size limits.
    BrowserTelemetryEvent:
      oneOf:
        - $ref: '#/components/schemas/BrowserConsoleLogEvent'
        - $ref: '#/components/schemas/BrowserConsoleErrorEvent'
        - $ref: '#/components/schemas/BrowserNetworkRequestEvent'
        - $ref: '#/components/schemas/BrowserNetworkResponseEvent'
        - $ref: '#/components/schemas/BrowserNetworkLoadingFailedEvent'
        - $ref: '#/components/schemas/BrowserNetworkIdleEvent'
        - $ref: '#/components/schemas/BrowserPageNavigationEvent'
        - $ref: '#/components/schemas/BrowserPageDomContentLoadedEvent'
        - $ref: '#/components/schemas/BrowserPageLoadEvent'
        - $ref: '#/components/schemas/BrowserPageTabOpenedEvent'
        - $ref: '#/components/schemas/BrowserPageLayoutShiftEvent'
        - $ref: '#/components/schemas/BrowserPageLcpEvent'
        - $ref: '#/components/schemas/BrowserPageLayoutSettledEvent'
        - $ref: '#/components/schemas/BrowserPageNavigationSettledEvent'
        - $ref: '#/components/schemas/BrowserInteractionClickEvent'
        - $ref: '#/components/schemas/BrowserInteractionKeyEvent'
        - $ref: '#/components/schemas/BrowserInteractionScrollSettledEvent'
        - $ref: '#/components/schemas/BrowserMonitorScreenshotEvent'
        - $ref: '#/components/schemas/BrowserMonitorDisconnectedEvent'
        - $ref: '#/components/schemas/BrowserMonitorReconnectedEvent'
        - $ref: '#/components/schemas/BrowserMonitorReconnectFailedEvent'
        - $ref: '#/components/schemas/BrowserMonitorInitFailedEvent'
        - $ref: '#/components/schemas/BrowserApiCallEvent'
        - $ref: '#/components/schemas/BrowserCdpConnectEvent'
        - $ref: '#/components/schemas/BrowserCdpDisconnectEvent'
        - $ref: '#/components/schemas/BrowserLiveViewConnectEvent'
        - $ref: '#/components/schemas/BrowserLiveViewDisconnectEvent'
        - $ref: '#/components/schemas/BrowserCaptchaSolveResultEvent'
        - $ref: '#/components/schemas/BrowserSystemOomKillEvent'
        - $ref: '#/components/schemas/BrowserServiceCrashedEvent'
      discriminator:
        propertyName: type
        mapping:
          console_log: '#/components/schemas/BrowserConsoleLogEvent'
          console_error: '#/components/schemas/BrowserConsoleErrorEvent'
          network_request: '#/components/schemas/BrowserNetworkRequestEvent'
          network_response: '#/components/schemas/BrowserNetworkResponseEvent'
          network_loading_failed: '#/components/schemas/BrowserNetworkLoadingFailedEvent'
          network_idle: '#/components/schemas/BrowserNetworkIdleEvent'
          page_navigation: '#/components/schemas/BrowserPageNavigationEvent'
          page_dom_content_loaded: '#/components/schemas/BrowserPageDomContentLoadedEvent'
          page_load: '#/components/schemas/BrowserPageLoadEvent'
          page_tab_opened: '#/components/schemas/BrowserPageTabOpenedEvent'
          page_layout_shift: '#/components/schemas/BrowserPageLayoutShiftEvent'
          page_lcp: '#/components/schemas/BrowserPageLcpEvent'
          page_layout_settled: '#/components/schemas/BrowserPageLayoutSettledEvent'
          page_navigation_settled: '#/components/schemas/BrowserPageNavigationSettledEvent'
          interaction_click: '#/components/schemas/BrowserInteractionClickEvent'
          interaction_key: '#/components/schemas/BrowserInteractionKeyEvent'
          interaction_scroll_settled: '#/components/schemas/BrowserInteractionScrollSettledEvent'
          monitor_screenshot: '#/components/schemas/BrowserMonitorScreenshotEvent'
          monitor_disconnected: '#/components/schemas/BrowserMonitorDisconnectedEvent'
          monitor_reconnected: '#/components/schemas/BrowserMonitorReconnectedEvent'
          monitor_reconnect_failed: '#/components/schemas/BrowserMonitorReconnectFailedEvent'
          monitor_init_failed: '#/components/schemas/BrowserMonitorInitFailedEvent'
          api_call: '#/components/schemas/BrowserApiCallEvent'
          cdp_connect: '#/components/schemas/BrowserCdpConnectEvent'
          cdp_disconnect: '#/components/schemas/BrowserCdpDisconnectEvent'
          live_view_connect: '#/components/schemas/BrowserLiveViewConnectEvent'
          live_view_disconnect: '#/components/schemas/BrowserLiveViewDisconnectEvent'
          captcha_solve_result: '#/components/schemas/BrowserCaptchaSolveResultEvent'
          system_oom_kill: '#/components/schemas/BrowserSystemOomKillEvent'
          service_crashed: '#/components/schemas/BrowserServiceCrashedEvent'
      description: |
        Union type representing any browser telemetry event. Discriminated on `type`. Each event's `category` determines when it is captured. The CDP collector-health events (monitor_disconnected, monitor_reconnected, monitor_reconnect_failed, monitor_init_failed) use the `monitor` category, which is not user-configurable: it flows automatically whenever any CDP category (console, network, page, interaction) is captured, and is silent otherwise. monitor_screenshot uses the opt-in `screenshot` category. All other event types are controlled by their per-category enable/disable flags.
    BrowserTelemetryEventEnvelope:
      type: object
      description: |
        Envelope wrapping a browser telemetry event with its monotonic sequence number. Each SSE data: frame carries one envelope as JSON. The seq value is also emitted as the SSE id: field so clients can pass it as Last-Event-ID on reconnect.
      required:
        - seq
        - event
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: |
            Process-monotonic sequence number assigned by the browser VM. Pass as Last-Event-ID on reconnect to resume without gaps. Gaps in received seq values indicate dropped events.
        event:
          $ref: '#/components/schemas/BrowserTelemetryEvent'
      additionalProperties: false
    Profile:
      type: object
      description: Browser profile metadata.
      properties:
        id:
          type: string
          description: Unique identifier for the profile
        name:
          type: string
          nullable: true
          description: Optional, easier-to-reference name for the profile
        created_at:
          type: string
          format: date-time
          description: Timestamp when the profile was created
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the profile was last updated
        last_used_at:
          type: string
          format: date-time
          description: Timestamp when the profile was last used
      required:
        - id
        - created_at
    ProfileRequest:
      type: object
      description: Request body for creating a profile.
      properties:
        name:
          type: string
          description: Optional name of the profile. Must be unique within the logical project; during the default-project migration, unscoped profiles and profiles in the org default project are treated as the same project.
      required: []
    ProfileUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: New profile name. Must be unique within the logical project; during the default-project migration, unscoped profiles and profiles in the org default project are treated as the same project.
          minLength: 1
          maxLength: 255
          example: my-renamed-profile
    BrowserProfile:
      type: object
      description: |
        Profile selection for the browser session. Provide either id or name. If specified, the
        matching profile will be loaded into the browser session. Profiles must be created beforehand.
      properties:
        id:
          type: string
          description: Profile ID to load for this browser session
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          description: Profile name to load for this browser session (instead of id). Must be 1-255 characters, using letters, numbers, dots, underscores, or hyphens.
        save_changes:
          type: boolean
          description: If true, save changes made during the session back to the profile when the session ends.
          default: false
      oneOf:
        - required:
            - id
        - required:
            - name
    BrowserPoolProfile:
      type: object
      description: |
        Profile configuration for browsers in a pool. Provide either id or name. Profiles must
        be created beforehand. Unlike single browser sessions, pools load the profile read-only
        and never persist changes back to it, so save_changes is omitted here. Any save_changes
        value sent on a pool profile is silently ignored rather than rejected.
      properties:
        id:
          type: string
          description: Profile ID to load for browsers in this pool
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          description: Profile name to load for browsers in this pool (instead of id). Must be 1-255 characters, using letters, numbers, dots, underscores, or hyphens.
      oneOf:
        - required:
            - id
        - required:
            - name
    ProxyRef:
      type: object
      description: |
        Proxy selection. Provide either id or name. The proxy must be in the same project as the resource referencing it.
        When selecting by name, the name must match exactly one active proxy in the project. Ambiguous names return a 400; use id for stable references.
      properties:
        id:
          type: string
          description: Proxy ID
        name:
          type: string
          description: Proxy name
      oneOf:
        - required:
            - id
        - required:
            - name
    BrowserProxyMode:
      type: string
      enum:
        - direct
        - default
      description: |
        Proxy egress mode. direct forces no proxy regardless of stealth. default uses the browser's stealth-derived default: Kernel's default stealth proxy when stealth=true, or direct egress when stealth=false.
        default is primarily useful on browser update to restore the browser default after selected-proxy egress.
    BrowserProxyConfig:
      type: object
      additionalProperties: false
      description: |
        Browser proxy configuration. Provide exactly one of mode, id, or name; an empty object is invalid.
        Set mode to direct for no proxy regardless of stealth. Set mode to default to use the browser's stealth-derived default: Kernel's default stealth proxy when stealth=true, or direct egress when stealth=false.
        Select id or name to use that proxy regardless of stealth. The selected proxy must be in the same project as the browser. Names must match exactly one active proxy; use id for stable references.
        Proxy configuration changes only egress and does not change stealth or CAPTCHA solver behavior. A stealth browser using mode=direct still runs in stealth mode with the CAPTCHA solver enabled.
        When proxy is omitted on browser creation, stealth browsers use Kernel's default stealth proxy and non-stealth browsers use direct egress. When omitted on update, the current configuration is unchanged.
      properties:
        mode:
          $ref: '#/components/schemas/BrowserProxyMode'
        id:
          type: string
          minLength: 1
          description: Proxy ID.
        name:
          type: string
          minLength: 1
          description: Proxy name. Must match exactly one active proxy in the project.
      oneOf:
        - required:
            - mode
        - required:
            - id
        - required:
            - name
    BrowserProxy:
      type: object
      additionalProperties: false
      description: Resolved proxy configuration for a browser session. Selected proxies are returned by stable ID.
      properties:
        mode:
          $ref: '#/components/schemas/BrowserProxyMode'
        id:
          type: string
          minLength: 1
          description: Selected proxy ID.
        name:
          type: string
          minLength: 1
          description: Selected proxy name.
      oneOf:
        - required:
            - mode
        - required:
            - id
        - required:
            - name
    BrowserViewport:
      type: object
      description: |
        Initial browser window size in pixels with optional refresh rate.
        If omitted, image defaults apply (1920x1080@25).
        For GPU images, the default is 1920x1080@60.
        Arbitrary viewport dimensions and refresh rates are accepted.
        Known-good presets include:
        2560x1440@10, 1920x1080@25, 1920x1200@25, 1440x900@25, 1280x800@60, 1024x768@60, 1200x800@60, 768x1024@60, 390x844@60.
        For GPU images, recommended presets use one of these resolutions with refresh rates 60, 30, 25, or 10:
        800x600, 960x720, 1024x576, 1024x768, 1152x648, 1200x800, 1280x720, 1368x768, 1440x900, 1600x900, 1920x1080, 1920x1200, 390x844, 360x250, 768x1024, 800x1600.
        Viewports outside this list may exhibit unstable live view or recording behavior.
        If refresh_rate is not provided, it will be automatically determined based on the resolution
        (higher resolutions use lower refresh rates to keep bandwidth reasonable).
      properties:
        width:
          type: integer
          description: Browser window width in pixels. Any positive integer is accepted.
          minimum: 1
          example: 1280
        height:
          type: integer
          description: Browser window height in pixels. Any positive integer is accepted.
          minimum: 1
          example: 800
        refresh_rate:
          type: integer
          description: Display refresh rate in Hz. Any positive integer is accepted; if omitted, automatically determined from width and height.
          minimum: 1
          example: 60
      required:
        - width
        - height
    BrowserViewportUpdate:
      description: Viewport configuration for updating a browser session. Extends BrowserViewport with update-only options.
      allOf:
        - $ref: '#/components/schemas/BrowserViewport'
        - type: object
          properties:
            force:
              type: boolean
              default: false
              description: |
                If true, allow the viewport change even when a live view or recording/replay is active.
                Active recordings will be gracefully stopped and restarted at the new resolution as
                separate segments. If false (default), the resize is refused when a live view or recording is active.
    Extension:
      type: object
      description: A browser extension uploaded to Kernel.
      properties:
        id:
          type: string
          description: Unique identifier for the extension
        name:
          type: string
          nullable: true
          description: Optional, easier-to-reference name for the extension. Must be unique within the project.
        created_at:
          type: string
          format: date-time
          description: Timestamp when the extension was created
        size_bytes:
          type: integer
          description: Size of the extension archive in bytes
        checksum:
          type: string
          nullable: true
          minLength: 64
          maxLength: 64
          description: SHA-256 checksum, encoded as lowercase hexadecimal, of the exact uploaded extension archive bytes. This is not a normalized checksum of the extension contents; archive metadata, file ordering, and compression can change the checksum for otherwise identical contents. Omitted for legacy rows and server-repackaged Chrome Web Store extensions.
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the extension was last used
      required:
        - id
        - created_at
        - size_bytes
    BrowserExtension:
      type: object
      description: |
        Extension selection for the browser session. Provide either id or name of an extension uploaded to Kernel.
      properties:
        id:
          type: string
          description: Extension ID to load for this browser session
        name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          description: Extension name to load for this browser session (instead of id). Must be 1-255 characters, using letters, numbers, dots, underscores, or hyphens.
      oneOf:
        - required:
            - id
        - required:
            - name
    BrowserPoolConfig:
      type: object
      description: |
        Effective browser pool configuration returned by the API.
      properties:
        size:
          type: integer
          description: |
            Number of browsers maintained in the pool. The maximum size is determined by your
            organization's pooled sessions limit (the sum of all pool sizes cannot exceed your limit).
          minimum: 1
          example: 10
        name:
          type: string
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          description: Optional name for the browser pool. Must be unique within the project.
          example: my-pool
        fill_rate_per_minute:
          type: integer
          description: Percentage of the pool to fill per minute. The cap is 25 for most organizations but can be raised per-organization, so only the lower bound is enforced here.
          minimum: 0
        timeout_seconds:
          type: integer
          description: Default idle timeout in seconds for browsers acquired from this pool before they are destroyed. Minimum 10, maximum 259200 (72 hours).
          minimum: 10
          maximum: 259200
        stealth:
          type: boolean
          description: If true, launches the browser in stealth mode to reduce detection by anti-bot mechanisms.
          example: true
        headless:
          type: boolean
          description: If true, launches the browser using a headless image.
          example: false
        profile:
          allOf:
            - $ref: '#/components/schemas/BrowserPoolProfile'
          description: Profile selection for browsers in the pool.
        refresh_on_profile_update:
          type: boolean
          description: |
            When true, flush idle browsers when the profile the pool uses is updated, so pool browsers
            pick up the latest profile data. When a profile is provided during creation, this defaults
            to true. Requires a profile to be set on the pool.
          example: true
        extensions:
          type: array
          description: List of browser extensions to load into the session. Provide each by id or name.
          maxItems: 20
          items:
            $ref: '#/components/schemas/BrowserExtension'
        proxy_id:
          type: string
          description: Optional proxy associated to the browser session. References a proxy in the same project as the browser session.
        viewport:
          allOf:
            - $ref: '#/components/schemas/BrowserViewport'
          description: Browser viewport used for newly-warmed browsers in this pool.
        kiosk_mode:
          type: boolean
          description: If true, launches the browser in kiosk mode to hide address bar and tabs in live view.
          example: true
        chrome_policy:
          type: object
          additionalProperties: true
          description: |
            Custom Chrome enterprise policy overrides applied to all browsers in this pool. Keys are Chrome enterprise policy names; values must match their expected types. Blocked: kernel-managed policies (extensions, proxy, CDP/automation). See https://chromeenterprise.google/policies/ The serialized JSON payload is capped at 5 MiB.
        start_url:
          type: string
          maxLength: 2048
          description: |
            Optional URL to navigate to when a new browser is warmed into the pool. Best-effort:
            failures to navigate do not fail pool fill. Only applied to newly-warmed browsers;
            browsers reused via release/acquire keep whatever URL the previous lease left them on.
            Accepts any URL Chromium can resolve, including chrome:// pages.
          example: https://example.com
        telemetry:
          $ref: '#/components/schemas/BrowserTelemetryConfig'
          nullable: true
          description: Active telemetry configuration applied to browsers warmed into this pool, if any.
      required:
        - size
    BrowserPoolCreateRequest:
      type: object
      description: |
        Parameters for creating a browser pool. All browsers in the pool will be created with the same configuration.
      properties:
        size:
          type: integer
          description: |
            Number of browsers to maintain in the pool. The maximum size is determined by your
            organization's pooled sessions limit (the sum of all pool sizes cannot exceed your limit).
          minimum: 1
          example: 10
        name:
          type: string
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          description: Optional name for the browser pool. Must be unique within the project.
          example: my-pool
        fill_rate_per_minute:
          type: integer
          description: Percentage of the pool to fill per minute. Defaults to 25. The cap is 25 for most organizations but can be raised per-organization, so only the lower bound is enforced here.
          minimum: 0
          default: 25
        timeout_seconds:
          type: integer
          description: Default idle timeout in seconds for browsers acquired from this pool before they are destroyed. Defaults to 600 seconds. Minimum 10, maximum 259200 (72 hours).
          minimum: 10
          maximum: 259200
          default: 600
        stealth:
          type: boolean
          description: If true, launches the browser in stealth mode to reduce detection by anti-bot mechanisms. Defaults to false.
          default: false
          example: true
        headless:
          type: boolean
          description: If true, launches the browser using a headless image. Defaults to false.
          default: false
          example: false
        profile:
          allOf:
            - $ref: '#/components/schemas/BrowserPoolProfile'
          description: Profile selection for browsers in the pool.
        refresh_on_profile_update:
          type: boolean
          description: |
            When true, flush idle browsers when the profile the pool uses is updated, so pool browsers
            pick up the latest profile data. When a profile is provided during creation, this defaults
            to true. Requires a profile to be set on the pool.
          example: true
          default: false
        extensions:
          type: array
          description: List of browser extensions to load into the session. Provide each by id or name.
          maxItems: 20
          items:
            $ref: '#/components/schemas/BrowserExtension'
        proxy_id:
          type: string
          description: Optional proxy to associate to the browser session. Must reference a proxy in the same project as the browser session.
        viewport:
          allOf:
            - $ref: '#/components/schemas/BrowserViewport'
          description: Browser viewport used for newly-warmed browsers in this pool.
        kiosk_mode:
          type: boolean
          description: If true, launches the browser in kiosk mode to hide address bar and tabs in live view. Defaults to false.
          default: false
          example: true
        chrome_policy:
          type: object
          additionalProperties: true
          description: |
            Custom Chrome enterprise policy overrides applied to all browsers in this pool. Keys are Chrome enterprise policy names; values must match their expected types. Blocked: kernel-managed policies (extensions, proxy, CDP/automation). See https://chromeenterprise.google/policies/ The serialized JSON payload is capped at 5 MiB.
        start_url:
          type: string
          maxLength: 2048
          description: |
            Optional URL to navigate to when a new browser is warmed into the pool. Best-effort:
            failures to navigate do not fail pool fill. Only applied to newly-warmed browsers;
            browsers reused via release/acquire keep whatever URL the previous lease left them on.
            Accepts any URL Chromium can resolve, including chrome:// pages.
          example: https://example.com
        telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          nullable: true
          description: |
            Telemetry configuration applied to browsers warmed into this pool. Set enabled to true to start capture using the default set, or provide browser category settings. If omitted, null, set to an empty object ({}), set to enabled: false without browser category settings, or all four CDP categories are explicitly disabled, no telemetry is configured on the pool. Only applied to newly-warmed browsers.
      required:
        - size
    BrowserPoolUpdateRequest:
      type: object
      description: |
        Parameters for updating a browser pool. Omitted fields leave existing values unchanged.
      properties:
        size:
          type: integer
          description: |
            If provided, replaces the number of browsers to maintain in the pool. The maximum
            size is determined by your organization's pooled sessions limit (the sum of all
            pool sizes cannot exceed your limit).
          minimum: 1
          example: 10
        name:
          type: string
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          description: |
            If provided, replaces the pool name. Empty string is a no-op; the pool name cannot
            be cleared or reset to empty once assigned.
          example: my-pool
        fill_rate_per_minute:
          type: integer
          description: |
            If provided, replaces the percentage of the pool to fill per minute. The cap is 25
            for most organizations but can be raised per-organization, so only the lower bound
            is enforced here.
          minimum: 0
        timeout_seconds:
          type: integer
          description: If provided, replaces the default idle timeout in seconds for browsers acquired from this pool before they are destroyed. Minimum 10, maximum 259200 (72 hours).
          minimum: 10
          maximum: 259200
        stealth:
          type: boolean
          description: If provided, replaces whether browsers launch in stealth mode.
          example: true
        headless:
          type: boolean
          description: If provided, replaces whether browsers launch using a headless image.
          example: false
        profile:
          allOf:
            - $ref: '#/components/schemas/BrowserPoolProfile'
          description: |
            If provided, replaces the previously-selected profile. To clear the profile reference,
            send `{ "id": "" }` or `{ "name": "" }`. An empty object (no id or name) is rejected
            as 400.
        refresh_on_profile_update:
          type: boolean
          description: |
            If provided, replaces whether idle browsers are flushed when the profile the pool uses
            is updated. When the pool's profile reference is changed (including newly attached) and
            this field is omitted, it defaults to true. Re-sending the same profile reference leaves
            this setting unchanged. Clearing the profile also disables this setting. Requires a
            profile to be set on the pool.
          example: true
        extensions:
          type: array
          description: |
            If provided, replaces the extension list. Empty array clears all previously-selected
            extensions. Omit this field to leave extensions unchanged.
          maxItems: 20
          items:
            $ref: '#/components/schemas/BrowserExtension'
        proxy_id:
          type: string
          description: Empty string clears the previously-selected proxy. Omit this field to leave the proxy unchanged.
        viewport:
          allOf:
            - $ref: '#/components/schemas/BrowserViewport'
          description: |
            If provided, replaces the viewport with the new width/height/refresh_rate. Because
            width and height are required and must be positive, the viewport cannot be cleared;
            omit this field to leave it unchanged.
        kiosk_mode:
          type: boolean
          description: If provided, replaces whether browsers launch in kiosk mode.
          example: true
        chrome_policy:
          type: object
          additionalProperties: true
          description: |
            If provided, replaces the custom Chrome enterprise policy overrides applied to all browsers in this pool. Empty object clears any previously-set policy. Keys are Chrome enterprise policy names; values must match their expected types. Blocked: kernel-managed policies (extensions, proxy, CDP/automation). See https://chromeenterprise.google/policies/ The serialized JSON payload is capped at 5 MiB.
        start_url:
          type: string
          maxLength: 2048
          description: |
            If provided, replaces the URL to navigate to when a new browser is warmed into the pool.
            Empty string clears the previously-set URL. Omit this field to leave it unchanged.
          example: https://example.com
        telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          nullable: true
          description: |
            If provided, updates the pool's telemetry configuration. Omit, set to null, or set to an empty object ({}) to leave the existing configuration unchanged. Set enabled to true to enable capture using the default set. Set enabled to false to clear the pool's telemetry. Provide browser category settings for per-category updates, merged onto the pool's current configuration. Only applied to browsers warmed after the update; browsers already in the pool keep their configuration until discarded.
        discard_all_idle:
          type: boolean
          description: 'Whether to discard all idle browsers and rebuild them immediately with the new configuration. Defaults to false. Only browsers that are idle when the update runs are rebuilt. A browser that is in use during the update keeps its original configuration, and if it is later released with `reuse: true` it returns to the pool with that stale configuration until it is discarded (by this flag on a later update, or by flushing the pool).'
          example: false
          default: false
    BrowserPoolDeleteRequest:
      type: object
      description: |
        Parameters for deleting a browser pool.
      properties:
        force:
          type: boolean
          default: false
          description: If true, force delete even if browsers are currently leased. Leased browsers will be terminated.
      required: []
    BrowserPool:
      type: object
      description: A browser pool containing multiple identically configured browsers.
      properties:
        id:
          type: string
          description: Unique identifier for the browser pool
          example: iv25ujqf37x3j07dwoffegqr
        name:
          type: string
          description: Browser pool name, if set
          example: my-pool
        available_count:
          type: integer
          description: Number of browsers currently available in the pool
          example: 85
        acquired_count:
          type: integer
          description: Number of browsers currently acquired from the pool
          example: 15
        created_at:
          type: string
          format: date-time
          description: Timestamp when the browser pool was created
        browser_pool_config:
          $ref: '#/components/schemas/BrowserPoolConfig'
          description: Configuration used to create all browsers in this pool
        profile_id:
          type: string
          description: Resolved profile ID the pool is attached to. Omitted when no profile is attached. Authoritative for programmatic consumers; the profile inside `browser_pool_config` reflects the configured selector (echoed as sent on create).
          example: iv25ujqf37x3j07dwoffegqr
        extension_ids:
          type: array
          description: Resolved extension IDs attached to the pool, in configured load order. Empty when no extensions are attached. Authoritative for programmatic consumers; the extensions inside `browser_pool_config` reflect the configured selector (echoed as sent on create).
          items:
            type: string
      required:
        - id
        - available_count
        - acquired_count
        - created_at
        - browser_pool_config
        - extension_ids
    BrowserPoolAcquireRequest:
      type: object
      description: Request body for acquiring a browser from the pool.
      properties:
        acquire_timeout_seconds:
          type: integer
          description: Maximum number of seconds to wait for a browser to be available. Defaults to the calculated time it would take to fill the pool at the currently configured fill rate.
        name:
          type: string
          description: |
            Optional human-readable name for the acquired browser session, used to find it later in the dashboard. Must be unique among active sessions within the pool's project. Applies to this lease only and is cleared when the browser is released back to the pool.
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9._-]{1,255}$
          example: checkout-flow-1
        tags:
          $ref: '#/components/schemas/Tags'
          description: |
            Optional user-defined key-value tags for the acquired browser session, used to find and group sessions later. Applies to this lease only and are cleared when the browser is released back to the pool. Up to 50 pairs.
        start_url:
          type: string
          description: 'Optional URL to navigate the acquired browser to. Overrides the pool''s start_url for this acquire only. Best-effort: failures to navigate do not fail the acquire.'
          example: https://example.com
        telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          nullable: true
          description: |
            Telemetry override for the acquired browser, applied to this lease only. Merges onto the browser's current (pool-inherited) telemetry using the same per-category semantics as PATCH /browsers: provided categories override the current configuration, omitted categories are inherited. Set enabled to true to resolve the config fresh from the default set, or enabled to false to stop capture. When the browser is released back to the pool with reuse, its telemetry is reset to the pool's baseline, so the override does not carry over to the next lease.
      required: []
    BrowserPoolReleaseRequest:
      type: object
      description: Request body for releasing a browser back to the pool.
      properties:
        session_id:
          type: string
          description: Browser session ID to release back to the pool
          example: ts8iy3sg25ibheguyni2lg9t
        reuse:
          type: boolean
          description: 'Whether to reuse the browser instance or destroy it and create a new one. Defaults to true. A reused browser keeps the configuration it was created with, so it does not pick up pool configuration changes made while it was in use. Release with `reuse: false`, or flush the pool afterward, to rebuild it with the current configuration.'
          default: true
          example: false
      required:
        - session_id
    LogEvent:
      type: object
      description: A log entry from the application.
      required:
        - event
        - message
        - timestamp
      properties:
        event:
          type: string
          const: log
          description: Event type identifier (always "log").
        timestamp:
          type: string
          format: date-time
          description: Time the log entry was produced.
        message:
          type: string
          description: Log message text.
    AppVersionSummaryEvent:
      type: object
      description: Summary of an application version.
      required:
        - event
        - timestamp
        - id
        - app_name
        - version
        - region
        - actions
      properties:
        event:
          type: string
          const: app_version_summary
          description: Event type identifier (always "app_version_summary").
        timestamp:
          type: string
          format: date-time
          description: Time the state was reported.
        id:
          type: string
          description: Unique identifier for the app version
          example: rr33xuugxj9h0bkf1rdt2bet
        app_name:
          type: string
          description: Name of the application
          example: my-app
        version:
          type: string
          description: Version label for the application
          example: 1.0.0
        region:
          type: string
          description: Deployment region code
          example: aws.us-east-1a
          const: aws.us-east-1a
        actions:
          type: array
          description: List of actions available on the app
          items:
            $ref: '#/components/schemas/AppAction'
        env_vars:
          type: object
          description: Environment variables configured for this app version. Not currently populated on streamed app_version_summary events.
          additionalProperties:
            type: string
    AppAction:
      type: object
      description: An action available on the app
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the action
          example: analyze
        input_schema:
          type: object
          nullable: true
          description: JSON Schema (draft-07) describing the expected input payload. Null if schema could not be automatically generated.
          additionalProperties: true
        output_schema:
          type: object
          nullable: true
          description: JSON Schema (draft-07) describing the expected output payload. Null if schema could not be automatically generated.
          additionalProperties: true
    ErrorEvent:
      type: object
      description: An error event from the application.
      required:
        - event
        - timestamp
        - error
      properties:
        event:
          type: string
          const: error
          description: Event type identifier (always "error").
        timestamp:
          type: string
          format: date-time
          description: Time the error occurred.
        error:
          $ref: '#/components/schemas/Error'
    AppVersionSummary:
      type: object
      description: Summary of an application version.
      properties:
        id:
          type: string
          description: Unique identifier for the app version
          example: rr33xuugxj9h0bkf1rdt2bet
        app_name:
          type: string
          description: Name of the application
          example: my-app
        version:
          type: string
          description: Version label for the application
          example: 1.0.0
        region:
          type: string
          description: Deployment region code
          example: aws.us-east-1a
          const: aws.us-east-1a
        deployment:
          type: string
          description: Deployment ID
        actions:
          type: array
          description: List of actions available on the app
          items:
            $ref: '#/components/schemas/AppAction'
        env_vars:
          type: object
          description: Environment variables configured for this app version. Values are redacted for API key, OAuth, and managed-auth callers, which receive every key with an empty string value. Only dashboard sessions receive the actual values.
          additionalProperties:
            type: string
      required:
        - id
        - app_name
        - version
        - region
        - deployment
        - actions
        - env_vars
    InvocationUpdateRequest:
      type: object
      description: Request body for updating an invocation.
      properties:
        status:
          type: string
          description: New status for the invocation.
          enum:
            - succeeded
            - failed
        output:
          type: string
          description: Updated output of the invocation rendered as JSON string.
      required:
        - status
    Deployment:
      type: object
      description: Deployment record information.
      properties:
        id:
          type: string
          description: Unique identifier for the deployment
          example: rr33xuugxj9h0bkf1rdt2bet
        status:
          type: string
          description: Current status of the deployment
          enum:
            - queued
            - in_progress
            - running
            - failed
            - stopped
          example: queued
        status_reason:
          type: string
          description: Status reason
          example: Deployment in progress
        region:
          type: string
          description: Deployment region code
          example: aws.us-east-1a
          const: aws.us-east-1a
        entrypoint_rel_path:
          type: string
          description: Relative path to the application entrypoint
          example: src/app.py
        env_vars:
          type: object
          description: Environment variables configured for this deployment. Values are redacted for API key, OAuth, and managed-auth callers, which receive every key with an empty string value. Only dashboard sessions receive the actual values.
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
          description: Timestamp when the deployment was created
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the deployment was last updated
        source_type:
          type: string
          description: Origin of the deployed source code. This is read-only response provenance; `file` indicates an uploaded archive and `github` indicates a repository fetched by the API.
          enum:
            - file
            - github
          x-go-type-name: DeploymentSourceOrigin
          example: github
        source_url:
          type: string
          description: For GitHub-sourced deployments, the repository URL that was fetched. Omitted for file uploads.
          example: https://github.com/org/repo
        source_ref:
          type: string
          description: For GitHub-sourced deployments, the git ref as requested at deploy time (branch, tag, or commit SHA — not resolved to a commit). Omitted for file uploads.
          example: main
        source_path:
          type: string
          description: For GitHub-sourced deployments, the subpath within the repository that was used as the deploy root. Omitted when the repo root was used or for file uploads.
          example: apps/api
        source_checksum:
          type: string
          description: Hex-encoded SHA-256 checksum of the source archive. For file uploads, this hashes the uploaded archive; for GitHub-sourced deployments, this hashes the GitHub archive downloaded by the API. Omitted for deployments created before this field was recorded.
          example: 3f4d0ea1bd2c5c1a1a1f0e9d8c7b6a5948372615049382716a5b4c3d2e1f0a9b
      required:
        - id
        - status
        - region
        - created_at
    DeploymentSource:
      type: object
      description: Source from which to fetch application code.
      properties:
        type:
          type: string
          description: Source type identifier.
          enum:
            - github
          example: github
        url:
          type: string
          description: Base repository URL (without blob/tree suffixes).
          example: https://github.com/org/repo
        ref:
          type: string
          description: Git ref (branch, tag, or commit SHA) to fetch.
          example: main
        path:
          type: string
          description: Path within the repo to deploy (omit to use repo root).
          example: apps/api
        entrypoint:
          type: string
          description: Relative path to the application entrypoint within the selected path.
          example: src/index.ts
        auth:
          type: object
          description: Authentication for private repositories.
          properties:
            method:
              type: string
              enum:
                - github_token
              description: Auth method
              example: github_token
            token:
              type: string
              format: password
              description: GitHub PAT or installation access token
              example: ghs_***
          required:
            - method
            - token
      required:
        - type
        - url
        - ref
        - entrypoint
    DeploymentRequest:
      type: object
      description: App deployment request. Provide either file+entrypoint_rel_path or source.
      properties:
        version:
          type: string
          description: Version of the application. Can be any string.
          example: 1.0.0
          default: latest
        file:
          type: string
          format: binary
          description: ZIP file containing the application source directory
          example: '@path/to/file.zip'
        entrypoint_rel_path:
          type: string
          description: Relative path to the entrypoint of the application
          example: src/app.py
        source:
          $ref: '#/components/schemas/DeploymentSource'
        region:
          type: string
          description: Region for deployment. Currently we only support "aws.us-east-1a"
          example: aws.us-east-1a
          default: aws.us-east-1a
          const: aws.us-east-1a
        force:
          type: boolean
          description: Allow overwriting an existing app version
          example: false
          default: false
        env_vars:
          type: object
          description: Map of environment variables to set for the deployed application. Each key-value pair represents an environment variable.
          additionalProperties:
            type: string
      oneOf:
        - required:
            - file
            - entrypoint_rel_path
        - required:
            - source
    DeploymentStateEvent:
      type: object
      description: An event representing the current state of a deployment.
      required:
        - event
        - deployment
        - timestamp
      properties:
        event:
          type: string
          const: deployment_state
          description: Event type identifier (always "deployment_state").
        deployment:
          $ref: '#/components/schemas/Deployment'
        timestamp:
          type: string
          format: date-time
          description: Time the state was reported.
    DeploymentEvent:
      oneOf:
        - $ref: '#/components/schemas/LogEvent'
        - $ref: '#/components/schemas/DeploymentStateEvent'
        - $ref: '#/components/schemas/AppVersionSummaryEvent'
        - $ref: '#/components/schemas/ErrorEvent'
        - $ref: '#/components/schemas/SSEHeartbeatEvent'
      discriminator:
        propertyName: event
        mapping:
          log: '#/components/schemas/LogEvent'
          deployment_state: '#/components/schemas/DeploymentStateEvent'
          app_version_summary: '#/components/schemas/AppVersionSummary'
          error: '#/components/schemas/InternalError'
          sse_heartbeat: '#/components/schemas/SSEHeartbeatEvent'
      description: Union type representing any deployment event.
    InvocationStateEvent:
      type: object
      description: An event representing the current state of an invocation.
      required:
        - event
        - invocation
        - timestamp
      properties:
        event:
          type: string
          const: invocation_state
          description: Event type identifier (always "invocation_state").
        invocation:
          $ref: '#/components/schemas/Invocation'
        timestamp:
          type: string
          format: date-time
          description: Time the state was reported.
    InvocationEvent:
      oneOf:
        - $ref: '#/components/schemas/LogEvent'
        - $ref: '#/components/schemas/InvocationStateEvent'
        - $ref: '#/components/schemas/ErrorEvent'
        - $ref: '#/components/schemas/SSEHeartbeatEvent'
      discriminator:
        propertyName: event
        mapping:
          log: '#/components/schemas/LogEvent'
          invocation_state: '#/components/schemas/InvocationStateEvent'
          error: '#/components/schemas/ErrorEvent'
          sse_heartbeat: '#/components/schemas/SSEHeartbeatEvent'
      description: Union type representing any invocation event.
    ManagedAuthStateEvent:
      type: object
      description: An event representing the current state of a managed auth flow.
      required:
        - event
        - timestamp
        - flow_status
        - flow_step
      properties:
        event:
          type: string
          const: managed_auth_state
          description: Event type identifier (always "managed_auth_state").
        timestamp:
          type: string
          format: date-time
          description: Time the state was reported.
        flow_status:
          type: string
          enum:
            - IN_PROGRESS
            - SUCCESS
            - FAILED
            - EXPIRED
            - CANCELED
          description: Current flow status.
        flow_step:
          type: string
          enum:
            - DISCOVERING
            - AWAITING_INPUT
            - AWAITING_EXTERNAL_ACTION
            - SUBMITTING
            - COMPLETED
          description: Current step in the flow.
        flow_type:
          type: string
          enum:
            - LOGIN
            - REAUTH
          description: Type of the current flow.
        fields:
          type: array
          description: Canonical fields awaiting input. Prefer this over discovered_fields when present.
          items:
            $ref: '#/components/schemas/ManagedAuthField'
        choices:
          type: array
          description: Canonical choices awaiting selection. Prefer this over pending_sso_buttons, mfa_options, and sign_in_options when present.
          items:
            $ref: '#/components/schemas/ManagedAuthChoice'
        discovered_fields:
          type: array
          description: Fields awaiting input (present when flow_step=AWAITING_INPUT; may also be present with AWAITING_EXTERNAL_ACTION as fallback actions).
          items:
            $ref: '#/components/schemas/DiscoveredField'
        mfa_options:
          type: array
          description: MFA method options (present when flow_step=AWAITING_INPUT; may also be present with AWAITING_EXTERNAL_ACTION as fallback actions).
          items:
            $ref: '#/components/schemas/MFAOption'
        sign_in_options:
          type: array
          description: Non-MFA choices presented during the auth flow, such as account selection or org pickers (present when flow_step=AWAITING_INPUT; may also be present with AWAITING_EXTERNAL_ACTION as fallback actions).
          items:
            $ref: '#/components/schemas/SignInOption'
        pending_sso_buttons:
          type: array
          description: SSO buttons available (present when flow_step=AWAITING_INPUT; may also be present with AWAITING_EXTERNAL_ACTION as fallback actions).
          items:
            $ref: '#/components/schemas/SSOButton'
        external_action_message:
          type: string
          description: Instructions for external action (present when flow_step=AWAITING_EXTERNAL_ACTION).
        website_error:
          type: string
          description: Visible error message from the website (e.g., 'Incorrect password'). Present when the website displays an error during login.
        error_message:
          type: string
          description: Error message (present when flow_status=FAILED).
        error_code:
          type: string
          description: Machine-readable error code (present when flow_status=FAILED).
        post_login_url:
          type: string
          format: uri
          description: URL where the browser landed after successful login.
        live_view_url:
          type: string
          format: uri
          description: Browser live view URL for debugging.
        hosted_url:
          type: string
          format: uri
          description: URL to redirect user to for hosted login.
    ManagedAuthEvent:
      oneOf:
        - $ref: '#/components/schemas/ManagedAuthStateEvent'
        - $ref: '#/components/schemas/ErrorEvent'
        - $ref: '#/components/schemas/SSEHeartbeatEvent'
      discriminator:
        propertyName: event
        mapping:
          managed_auth_state: '#/components/schemas/ManagedAuthStateEvent'
          error: '#/components/schemas/ErrorEvent'
          sse_heartbeat: '#/components/schemas/SSEHeartbeatEvent'
      description: Union type representing any managed auth event.
    ManagedAuthTimelineEvent:
      type: object
      description: A single event in an auth connection's history — a login attempt, an automatic re-auth attempt, or a health check.
      required:
        - type
        - id
        - timestamp
        - status
      properties:
        type:
          type: string
          enum:
            - login
            - reauth
            - health_check
          description: The kind of event. "login" and "reauth" are authentication attempts; "health_check" is a periodic session-validity check.
        id:
          type: string
          description: Identifier of the underlying login/reauth session or health check.
        timestamp:
          type: string
          format: date-time
          description: When the event occurred.
        status:
          type: string
          enum:
            - IN_PROGRESS
            - SUCCESS
            - EXPIRED
            - CANCELED
            - FAILED
            - AUTHENTICATED
            - NEEDS_AUTH
          description: |
            Outcome of the event. For login/reauth events this is the flow status
            (IN_PROGRESS, SUCCESS, EXPIRED, CANCELED, FAILED). For health_check events
            it is the observed session state (AUTHENTICATED, NEEDS_AUTH).
        previous_status:
          type: string
          enum:
            - AUTHENTICATED
            - NEEDS_AUTH
          description: The session state observed before this event. Present for health_check events that recorded a prior state.
        step:
          type: string
          enum:
            - INITIALIZED
            - DISCOVERING
            - AWAITING_INPUT
            - AWAITING_EXTERNAL_ACTION
            - AWAITING_HUMAN_INTERVENTION
            - SUBMITTING
            - COMPLETED
            - EXPIRED
          description: The step the flow reached. Present for login/reauth events.
        error_code:
          type: string
          description: Machine-readable error code. Present when a login/reauth event failed.
        error_message:
          type: string
          description: Human-readable error message. Present when a login/reauth event failed.
        website_error:
          type: string
          description: Visible error message from the website (e.g., 'Incorrect password'). Present when the website displayed an error during the attempt.
        browser_session_id:
          type: string
          description: Browser session that produced the event, if one was created.
        replay_id:
          type: string
          description: Replay recording ID for the event's browser session, if session recording was enabled.
        telemetry_captured:
          type: boolean
          description: Whether browser telemetry capture started for this event's browser session.
        updated_at:
          type: string
          format: date-time
          description: When the event was last updated. Present for login/reauth events.
    SSEHeartbeatEvent:
      type: object
      description: Heartbeat event sent periodically to keep SSE connection alive.
      required:
        - event
        - timestamp
      properties:
        event:
          type: string
          const: sse_heartbeat
          description: Event type identifier (always "sse_heartbeat").
        timestamp:
          type: string
          format: date-time
          description: Time the heartbeat was sent.
    BrowserReplay:
      type: object
      description: Information about a browser replay recording.
      required:
        - replay_id
      properties:
        replay_id:
          type: string
          description: Unique identifier for the replay recording.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when replay started
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when replay finished
        replay_view_url:
          type: string
          description: URL for viewing the replay recording.
          example: https://api.onkernel.com/browser/replays?jwt=eyJ0eXAi...&replay_id=7e2c1a9f-1234-4cde-9abc-ffeedd001122
    StartFsWatchRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Directory to watch.
        recursive:
          type: boolean
          description: Whether to watch recursively.
          default: false
      additionalProperties: false
    FileSystemEvent:
      type: object
      description: Filesystem change event.
      required:
        - type
        - path
      properties:
        type:
          type: string
          enum:
            - CREATE
            - WRITE
            - DELETE
            - RENAME
          description: Event type.
        name:
          type: string
          description: Base name of the file or directory affected.
        path:
          type: string
          description: Absolute path of the file or directory.
        is_dir:
          type: boolean
          description: Whether the affected path is a directory.
    FileInfo:
      type: object
      required:
        - name
        - path
        - size_bytes
        - is_dir
        - mod_time
        - mode
      properties:
        name:
          type: string
          description: Base name of the file or directory.
        path:
          type: string
          description: Absolute path.
        size_bytes:
          type: integer
          description: Size in bytes. 0 for directories.
        is_dir:
          type: boolean
          description: Whether the path is a directory.
        mod_time:
          type: string
          format: date-time
          description: Last modification time.
        mode:
          type: string
          description: File mode bits (e.g., "drwxr-xr-x" or "-rw-r--r--").
    ListFiles:
      type: array
      description: Array of file or directory information entries.
      items:
        $ref: '#/components/schemas/FileInfo'
    CreateDirectoryRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Absolute directory path to create.
          pattern: ^/.*
        mode:
          type: string
          description: Optional directory mode (octal string, e.g. 755). Defaults to 755.
          pattern: ^[0-7]{3,4}$
      additionalProperties: false
    DeletePathRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Absolute path to delete.
          pattern: ^/.*
      additionalProperties: false
    SetFilePermissionsRequest:
      type: object
      required:
        - path
        - mode
      properties:
        path:
          type: string
          description: Absolute path whose permissions are to be changed.
          pattern: ^/.*
        owner:
          type: string
          description: New owner username or UID.
        group:
          type: string
          description: New group name or GID.
        mode:
          type: string
          description: File mode bits (octal string, e.g. 644).
          pattern: ^[0-7]{3,4}$
      additionalProperties: false
    MovePathRequest:
      type: object
      required:
        - src_path
        - dest_path
      properties:
        src_path:
          type: string
          description: Absolute source path.
          pattern: ^/.*
        dest_path:
          type: string
          description: Absolute destination path.
          pattern: ^/.*
      additionalProperties: false
    BrowserCurlRequest:
      type: object
      description: Request to make an HTTP request through the browser's network stack.
      required:
        - url
      properties:
        url:
          type: string
          description: Target URL (must be http or https).
        method:
          type: string
          description: HTTP method.
          enum:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          default: GET
        headers:
          type: object
          description: Custom headers merged with browser defaults.
          additionalProperties:
            type: string
        body:
          type: string
          description: Request body (for POST/PUT/PATCH).
        timeout_ms:
          type: integer
          description: Request timeout in milliseconds.
          minimum: 1000
          maximum: 60000
          default: 30000
        response_encoding:
          type: string
          description: Encoding for the response body. Use base64 for binary content.
          enum:
            - utf8
            - base64
          default: utf8
      additionalProperties: false
    BrowserCurlResult:
      type: object
      description: Structured response from the browser curl request.
      required:
        - status
        - headers
        - body
        - duration_ms
      properties:
        status:
          type: integer
          description: HTTP status code from target.
        headers:
          type: object
          description: Response headers (multi-value).
          additionalProperties:
            type: array
            items:
              type: string
        body:
          type: string
          description: Response body (UTF-8 string or base64 depending on request).
        duration_ms:
          type: integer
          description: Total request duration in milliseconds.
      additionalProperties: false
    BrowserCurlTransportError:
      type: object
      description: Transport-level error when the request could not complete.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable error description.
        net_error:
          type: integer
          description: Chromium net error code.
        net_error_name:
          type: string
          description: Chromium net error name.
      additionalProperties: false
    ProcessExecRequest:
      type: object
      description: Request to execute a command synchronously.
      required:
        - command
      properties:
        command:
          type: string
          description: Executable or shell command to run.
        args:
          type: array
          description: Command arguments.
          items:
            type: string
          default: []
        cwd:
          type: string
          description: Working directory (absolute path) to run the command in.
          nullable: true
          pattern: ^/.*
        env:
          type: object
          description: Environment variables to set for the process.
          additionalProperties:
            type: string
          default: {}
        as_user:
          type: string
          description: Run the process as this user.
          nullable: true
        as_root:
          type: boolean
          description: Run the process with root privileges.
          default: false
        timeout_sec:
          type: integer
          description: Maximum execution time in seconds.
          nullable: true
      additionalProperties: false
    ProcessExecResult:
      type: object
      description: Result of a synchronous command execution.
      properties:
        exit_code:
          type: integer
          description: Process exit code.
        stdout_b64:
          type: string
          description: Base64-encoded stdout buffer.
        stderr_b64:
          type: string
          description: Base64-encoded stderr buffer.
        duration_ms:
          type: integer
          description: Execution duration in milliseconds.
      additionalProperties: false
    ProcessSpawnRequest:
      allOf:
        - $ref: '#/components/schemas/ProcessExecRequest'
        - type: object
          properties:
            allocate_tty:
              type: boolean
              description: Allocate a pseudo-terminal (PTY) for interactive shells.
              default: false
            rows:
              type: integer
              description: Initial terminal rows. Only used when allocate_tty is true.
              minimum: 1
              maximum: 65535
            cols:
              type: integer
              description: Initial terminal columns. Only used when allocate_tty is true.
              minimum: 1
              maximum: 65535
    ProcessResizeRequest:
      type: object
      description: Resize a PTY-backed process terminal.
      required:
        - rows
        - cols
      properties:
        rows:
          type: integer
          minimum: 1
          maximum: 65535
          description: New terminal rows.
        cols:
          type: integer
          minimum: 1
          maximum: 65535
          description: New terminal columns.
      additionalProperties: false
    ProcessSpawnResult:
      type: object
      description: Information about a spawned process.
      properties:
        process_id:
          type: string
          format: uuid
          description: Server-assigned identifier for the process.
        pid:
          type: integer
          description: OS process ID.
        started_at:
          type: string
          format: date-time
          description: Timestamp when the process started.
      additionalProperties: false
    ProcessStatus:
      type: object
      description: Current status of a process.
      properties:
        state:
          type: string
          enum:
            - running
            - exited
          description: Process state.
        exit_code:
          type: integer
          nullable: true
          description: Exit code if the process has exited.
        cpu_pct:
          type: number
          description: Estimated CPU usage percentage.
        mem_bytes:
          type: integer
          description: Estimated resident memory usage in bytes.
      additionalProperties: false
    ProcessStdinRequest:
      type: object
      description: Data to write to the process standard input.
      required:
        - data_b64
      properties:
        data_b64:
          type: string
          description: Base64-encoded data to write.
      additionalProperties: false
    ProcessStdinResult:
      type: object
      description: Result of writing to stdin.
      properties:
        written_bytes:
          type: integer
          description: Number of bytes written.
      additionalProperties: false
    ProcessKillRequest:
      type: object
      description: Signal to send to the process.
      required:
        - signal
      properties:
        signal:
          type: string
          enum:
            - TERM
            - KILL
            - INT
            - HUP
          default: TERM
          description: Signal to send.
      additionalProperties: false
    ProcessStreamEvent:
      type: object
      description: SSE payload representing process output or lifecycle events.
      properties:
        stream:
          type: string
          description: Source stream of the data chunk.
          enum:
            - stdout
            - stderr
        data_b64:
          type: string
          description: Base64-encoded data from the process stream.
        event:
          type: string
          description: Lifecycle event type.
          enum:
            - exit
        exit_code:
          type: integer
          description: Exit code when the event is "exit".
      additionalProperties: false
    ExecutePlaywrightRequest:
      type: object
      description: Request to execute Playwright code
      required:
        - code
      properties:
        code:
          type: string
          description: |
            TypeScript/JavaScript code to execute. The code has access to 'page', 'context', and 'browser' variables.
            It runs within a function, so you can use a return statement at the end to return a value.
            This value is returned as the `result` property in the response.
            Example: "await page.goto('https://example.com'); return await page.title();"
        timeout_sec:
          type: integer
          description: Maximum execution time in seconds. Default is 60.
          default: 60
          minimum: 1
          maximum: 300
      additionalProperties: false
    ExecutePlaywrightResult:
      type: object
      description: Result of Playwright code execution
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the code executed successfully
        result:
          description: The value returned by the code (if any)
        error:
          type: string
          description: Error message if execution failed
        stdout:
          type: string
          description: Standard output from the execution
        stderr:
          type: string
          description: Standard error from the execution
      additionalProperties: false
    ManagedAuthExchangeRequest:
      type: object
      description: Request to exchange handoff code for JWT
      required:
        - code
      properties:
        code:
          type: string
          description: Handoff code from start endpoint
          example: abc123xyz
      additionalProperties: false
    ManagedAuthExchangeResponse:
      type: object
      description: Response from exchange endpoint
      required:
        - invocation_id
        - jwt
      properties:
        invocation_id:
          type: string
          description: Invocation ID
          example: abc123xyz
        jwt:
          type: string
          description: JWT token with invocation_id claim (30 minute TTL)
          example: eyJ0eXAi...
      additionalProperties: false
    ManagedAuthField:
      type: object
      description: Canonical field awaiting user input.
      required:
        - id
        - ref
        - type
      properties:
        id:
          type: string
          description: Stable field identifier for canonical submit.
          example: field_email
        ref:
          type: string
          description: Credential reference name to store the submitted value under.
          example: email
        type:
          type: string
          enum:
            - identifier
            - password
            - code
            - totp_code
            - totp_secret
            - text
          description: Managed-auth field type.
          example: identifier
        label:
          type: string
          description: Human-readable label shown to the user.
          example: Email address
        required:
          type: boolean
          description: Whether this field is required.
          default: true
        replace_existing:
          type: boolean
          description: Whether the submitted value must replace an existing credential after explicit rejection.
          default: false
        observed_selector:
          type: string
          nullable: true
          description: Selector for the visible field, when available.
          example: input[name="identifier"]
      additionalProperties: false
    ManagedAuthChoice:
      type: object
      description: Canonical auth-flow choice awaiting user selection.
      required:
        - id
        - type
        - label
      properties:
        id:
          type: string
          description: Stable choice identifier for canonical submit.
          example: google
        type:
          type: string
          enum:
            - mfa_method
            - sso_provider
            - sign_in_method
            - auth_method
            - identifier_method
            - account
            - other
          description: Choice type.
          example: sso_provider
        label:
          type: string
          description: Human-readable choice label.
          example: Google
        description:
          type: string
          nullable: true
          description: Additional context for the choice.
        observed_selector:
          type: string
          nullable: true
          description: Selector for the visible choice, when available.
          example: button:has-text("Google")
      additionalProperties: false
    DiscoveredField:
      type: object
      description: A discovered form field
      properties:
        name:
          type: string
          description: Field name
          example: email
        type:
          type: string
          enum:
            - text
            - email
            - password
            - tel
            - number
            - url
            - code
            - totp
          description: Field type
          example: email
        label:
          type: string
          description: Field label
          example: Email address
        placeholder:
          type: string
          description: Field placeholder
          example: you@example.com
        required:
          type: boolean
          description: Whether field is required
          default: true
          example: true
        selector:
          type: string
          description: CSS selector for the field
          example: input#email
        linked_mfa_type:
          $ref: '#/components/schemas/MFAType'
          nullable: true
          description: If this field is associated with an MFA option, the type of that option (e.g., password field linked to "Enter password" option)
        hint:
          type: string
          description: Contextual help text near the field that tells the user what to enter (e.g., "Enter the phone ending in (***) ***-**92")
          example: Enter the phone ending in (***) ***-**92
      required:
        - name
        - type
        - label
        - selector
      additionalProperties: false
    MFAType:
      type: string
      enum:
        - sms
        - call
        - email
        - totp
        - push
        - password
        - switch
      description: The MFA delivery method type. Includes 'password' for auth method selection pages and 'switch' for generic method-switcher links like "Use another method" that do not name a specific method.
      example: sms
    MFAOption:
      type: object
      description: An MFA method option for verification
      properties:
        type:
          $ref: '#/components/schemas/MFAType'
        label:
          type: string
          description: The visible option text
          example: Text me a code
        target:
          type: string
          nullable: true
          description: The masked destination (phone/email) if shown
          example: '***-***-5678'
        description:
          type: string
          nullable: true
          description: Additional instructions from the site
          example: We'll send a 6-digit code to your phone
      required:
        - type
        - label
      additionalProperties: false
    SignInOption:
      type: object
      description: A non-MFA choice presented during the auth flow (e.g. account selection, org picker)
      properties:
        id:
          type: string
          description: Unique identifier for this option (used to submit selection back)
          example: work-account
        label:
          type: string
          description: Display text for the option
          example: Work Account (user@company.com)
        description:
          type: string
          nullable: true
          description: Additional context such as email address or org name
          example: user@company.com
      required:
        - id
        - label
      additionalProperties: false
    SSOButton:
      type: object
      description: An SSO button for signing in with an external identity provider
      properties:
        selector:
          type: string
          description: XPath selector for the button
          example: xpath=//button[contains(text(), 'Continue with Google')]
        provider:
          type: string
          description: Identity provider name
          example: google
        label:
          type: string
          description: Visible button text
          example: Continue with Google
      required:
        - selector
        - provider
        - label
      additionalProperties: false
    ManagedAuth:
      type: object
      description: Managed authentication that keeps a profile logged into a specific domain. Flow fields (flow_status, flow_step, discovered_fields, mfa_options) reflect the most recent login flow and are null when no flow has been initiated.
      required:
        - id
        - profile_name
        - domain
        - status
        - save_credentials
        - record_session
      properties:
        id:
          type: string
          description: Unique identifier for the auth connection
          example: ma_abc123xyz
        profile_name:
          type: string
          description: Name of the profile associated with this auth connection
          example: my-netflix-profile
        domain:
          type: string
          description: Target domain for authentication
          example: netflix.com
        status:
          type: string
          enum:
            - AUTHENTICATED
            - NEEDS_AUTH
          description: Current authentication status of the managed profile
          example: AUTHENTICATED
        last_auth_check_at:
          type: string
          format: date-time
          description: When the most recent auth health check ran for this connection, regardless of outcome. Updated on every health check and does not by itself indicate that the profile is currently authenticated - use `status` for that. May be newer than `flow_expires_at` when a flow is still in progress because health checks continue to run in parallel.
          example: "2025-01-15T10:30:00Z"
        last_auth_at:
          type: string
          format: date-time
          deprecated: true
          description: Deprecated alias for `last_auth_check_at`. Despite the name, this is the last health-check timestamp, not the last successful authentication. Use `last_auth_check_at` instead.
          example: "2025-01-15T10:30:00Z"
        credential:
          $ref: '#/components/schemas/CredentialReference'
        can_reauth:
          type: boolean
          description: Whether Kernel can automatically re-authenticate this connection when the session expires. Requires a prior successful login plus either a Kernel credential or an external credential reference. See `can_reauth_reason` for the specific outcome.
          example: true
        can_reauth_reason:
          type: string
          description: |-
            Machine-readable reason for the current value of `can_reauth`.
            Affirmative values (re-auth is possible):
              - `external_credential` — an external credential provider is attached
              - `cua_has_credential` — CUA flow with a stored credential
              - `has_credential` — Kernel credential is attached (optimistic; plan viability not checked)
              - `viable_plans_found` — at least one stored login plan can be replayed
              - `no_requirements_recorded` — no recorded credential requirements to fail against
              - `requirements_satisfiable` — recorded requirements can be met by the attached credential

            Negative values (a human must complete the login flow):
              - `no_prior_successful_login` — connection has never completed a successful login
              - `no_credential` — no Kernel or external credential attached
              - `no_viable_plans` — credential attached but no replayable login plan exists yet
              - `viable_plans_require_external_action` — stored plans need an external step (email link, push, etc.)
              - `requires_external_action` — recorded requirements include an external step
              - `requires_totp_without_secret` — flow needs a TOTP code but no TOTP secret is stored
              - `requires_sms_code` — flow needs an SMS code that cannot be received automatically
              - `requires_email_code` — flow needs an email code that cannot be received automatically
              - `requires_customer_input` — flow needs another field or choice that is unavailable during unattended re-authentication
          enum:
            - external_credential
            - cua_has_credential
            - has_credential
            - viable_plans_found
            - no_requirements_recorded
            - requirements_satisfiable
            - no_prior_successful_login
            - no_credential
            - no_viable_plans
            - viable_plans_require_external_action
            - requires_external_action
            - requires_totp_without_secret
            - requires_sms_code
            - requires_email_code
            - requires_customer_input
          example: has_credential
        proxy_id:
          type: string
          deprecated: true
          description: Deprecated. Read browser.proxy instead. Retained during migration for existing clients.
        allowed_domains:
          type: array
          items:
            type: string
          description: |
            Additional domains that are valid for this auth flow (besides the primary domain). Useful when login pages redirect to different domains.

            The following SSO/OAuth provider domains are automatically allowed by default and do not need to be specified:
            - Google: accounts.google.com
            - Microsoft/Azure AD: login.microsoftonline.com, login.live.com
            - Okta: *.okta.com, *.oktapreview.com
            - Auth0: *.auth0.com, *.us.auth0.com, *.eu.auth0.com, *.au.auth0.com
            - Apple: appleid.apple.com
            - GitHub: github.com
            - Facebook/Meta: www.facebook.com
            - LinkedIn: www.linkedin.com
            - Amazon Cognito: *.amazoncognito.com
            - OneLogin: *.onelogin.com
            - Ping Identity: *.pingone.com, *.pingidentity.com
          example:
            - login.netflix.com
            - auth.netflix.com
        login_url:
          type: string
          format: uri
          description: Optional login page URL to skip discovery
          example: https://example.com/login
        post_login_url:
          type: string
          format: uri
          description: URL where the browser landed after successful login
          example: https://www.netflix.com/browse
        flow_status:
          type: string
          enum:
            - IN_PROGRESS
            - SUCCESS
            - FAILED
            - EXPIRED
            - CANCELED
          nullable: true
          description: Current flow status (null when no flow in progress)
          example: IN_PROGRESS
        flow_step:
          type: string
          enum:
            - DISCOVERING
            - AWAITING_INPUT
            - AWAITING_EXTERNAL_ACTION
            - SUBMITTING
            - COMPLETED
          nullable: true
          description: Current step in the flow (null when no flow in progress)
          example: AWAITING_INPUT
        flow_type:
          type: string
          enum:
            - LOGIN
            - REAUTH
          nullable: true
          description: Type of the current flow (null when no flow in progress)
          example: LOGIN
        flow_expires_at:
          type: string
          format: date-time
          nullable: true
          description: When the current flow expires (null when no flow in progress). A flow past this timestamp is no longer valid and its `flow_status` will be `EXPIRED`. Clients may start a new login to supersede a stale `IN_PROGRESS` flow past this timestamp.
          example: "2025-11-05T20:00:00Z"
        fields:
          type: array
          nullable: true
          description: Canonical fields awaiting input. Prefer this over discovered_fields when present.
          items:
            $ref: '#/components/schemas/ManagedAuthField'
        choices:
          type: array
          nullable: true
          description: Canonical choices awaiting selection. Prefer this over pending_sso_buttons, mfa_options, and sign_in_options when present.
          items:
            $ref: '#/components/schemas/ManagedAuthChoice'
        discovered_fields:
          type: array
          nullable: true
          description: Fields awaiting input (present when flow_step=awaiting_input; may also be present with awaiting_external_action as fallback actions)
          items:
            $ref: '#/components/schemas/DiscoveredField'
        mfa_options:
          type: array
          nullable: true
          description: MFA method options (present when flow_step=awaiting_input; may also be present with awaiting_external_action as fallback actions)
          items:
            $ref: '#/components/schemas/MFAOption'
        sign_in_options:
          type: array
          nullable: true
          description: Non-MFA choices presented during the auth flow, such as account selection or org pickers (present when flow_step=awaiting_input; may also be present with awaiting_external_action as fallback actions).
          items:
            $ref: '#/components/schemas/SignInOption'
        pending_sso_buttons:
          type: array
          nullable: true
          description: SSO buttons available (present when flow_step=awaiting_input; may also be present with awaiting_external_action as fallback actions)
          items:
            $ref: '#/components/schemas/SSOButton'
        external_action_message:
          type: string
          nullable: true
          description: Instructions for external action (present when flow_step=awaiting_external_action)
          example: Tap 'Yes' on the Google prompt on your phone
        website_error:
          type: string
          nullable: true
          description: Visible error message from the website (e.g., 'Incorrect password'). Present when the website displays an error during login.
        sso_provider:
          type: string
          nullable: true
          description: SSO provider being used (e.g., google, github, microsoft)
          example: google
        error_message:
          type: string
          nullable: true
          description: Error message (present when flow_status=failed)
          example: Invalid password
        error_code:
          type: string
          nullable: true
          description: Machine-readable error code (present when flow_status=failed)
        hosted_url:
          type: string
          format: uri
          nullable: true
          description: URL to redirect user to for hosted login (present when flow in progress)
          example: https://auth.kernel.com/login/abc123xyz
        live_view_url:
          type: string
          format: uri
          nullable: true
          description: Browser live view URL for debugging (present when flow in progress)
          example: https://live.kernel.com/abc123xyz
        browser_session_id:
          type: string
          nullable: true
          description: |
            ID of the underlying browser session driving the current flow (present when flow in progress).
            Use this to inspect or terminate the browser session via the `/browsers` API.
          example: bs_abc123xyz
        health_check_interval:
          type: integer
          nullable: true
          minimum: 300
          maximum: 86400
          description: |
            Interval in seconds between automatic health checks. When set, the system periodically
            verifies the authentication status and triggers re-authentication if needed.
            Maximum is 86400 (24 hours). Default is 3600 (1 hour) or your plan minimum, whichever
            is larger. The minimum depends on your plan: Enterprise: 300 (5 minutes), Startup: 1200
            (20 minutes), Hobbyist: 3600 (1 hour), Free: 21600 (6 hours).
          example: 3600
        health_checks:
          type: boolean
          description: |
            Whether periodic health checks are enabled for this connection. When false, the system
            will not automatically verify authentication status, and `auto_reauth` has no effect on
            the automatic flow (since re-auth is only triggered by a failed scheduled health check).
            Manually triggering a health check via the API still works regardless of this setting.
          example: true
        auto_reauth:
          type: boolean
          description: |
            Whether automatic re-authentication is permitted for this connection. This is an opt-in
            flag only — it does not check whether re-auth is actually feasible. Even when true,
            re-auth only runs when the system has what it needs to perform it (for example, saved
            credentials for the required login fields), and only after a scheduled health check
            detects an expired session — so this flag has no effect when `health_checks` is false.
            When false, expired sessions detected by a health check are marked as `NEEDS_AUTH`
            instead of attempting re-auth.
          example: true
        save_credentials:
          type: boolean
          description: Whether credentials are saved after every successful login. One-time codes (TOTP, SMS, etc.) are not saved.
          example: true
        record_session:
          type: boolean
          description: Whether to record browser session replays for this connection by default. Useful for debugging login flows. Can be overridden per-login.
          example: false
        browser:
          $ref: '#/components/schemas/ManagedAuthBrowserConfig'
          description: Default browser configuration for login, reauthentication, and health-check sessions.
        browser_telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          nullable: true
          deprecated: true
          description: Deprecated. Use browser.telemetry. Retained during migration for existing clients.
      additionalProperties: false
    ManagedAuthBrowserConfig:
      type: object
      description: Browser configuration applied to browser sessions created for a managed auth connection. Managed auth controls the profile, headless mode, timeout, start URL, kiosk mode, and viewport.
      properties:
        stealth:
          type: boolean
          description: Whether managed auth browser sessions use stealth mode. Defaults to true when omitted.
          example: false
        proxy:
          $ref: '#/components/schemas/BrowserProxyConfig'
          description: Proxy configuration for managed auth browser sessions. Omit on create to derive the default from stealth, or on update and login to preserve or inherit the connection default.
        telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          nullable: true
          description: Browser telemetry configuration using the same semantics as browser create.
      additionalProperties: false
    ManagedAuthCreateRequest:
      type: object
      description: Request to create an auth connection for a profile and domain
      required:
        - domain
        - profile_name
      properties:
        domain:
          type: string
          description: Domain for authentication
          example: netflix.com
        profile_name:
          type: string
          description: Name of the profile to manage authentication for. If the profile does not exist, it is created automatically.
          example: user-123
        login_url:
          type: string
          format: uri
          description: Optional login page URL to skip discovery
          example: https://netflix.com/login
        browser:
          $ref: '#/components/schemas/ManagedAuthBrowserConfig'
          description: Default browser configuration for login, reauthentication, and health-check sessions.
        proxy:
          $ref: '#/components/schemas/ProxyRef'
          deprecated: true
          description: Deprecated. Use browser.proxy. Retained during migration for existing clients.
        credential:
          $ref: '#/components/schemas/CredentialReference'
        allowed_domains:
          type: array
          items:
            type: string
          description: |
            Additional domains valid for this auth flow (besides the primary domain). Useful when login pages redirect to different domains.

            The following SSO/OAuth provider domains are automatically allowed by default and do not need to be specified:
            - Google: accounts.google.com
            - Microsoft/Azure AD: login.microsoftonline.com, login.live.com
            - Okta: *.okta.com, *.oktapreview.com
            - Auth0: *.auth0.com, *.us.auth0.com, *.eu.auth0.com, *.au.auth0.com
            - Apple: appleid.apple.com
            - GitHub: github.com
            - Facebook/Meta: www.facebook.com
            - LinkedIn: www.linkedin.com
            - Amazon Cognito: *.amazoncognito.com
            - OneLogin: *.onelogin.com
            - Ping Identity: *.pingone.com, *.pingidentity.com
          example:
            - login.netflix.com
            - auth.netflix.com
        health_check_interval:
          type: integer
          minimum: 300
          maximum: 86400
          description: |
            Interval in seconds between automatic health checks. When set, the system periodically
            verifies the authentication status and triggers re-authentication if needed.
            Maximum is 86400 (24 hours). Default is 3600 (1 hour) or your plan minimum, whichever
            is larger. The minimum depends on your plan: Enterprise: 300 (5 minutes), Startup: 1200
            (20 minutes), Hobbyist: 3600 (1 hour), Free: 21600 (6 hours).
          example: 3600
        health_checks:
          type: boolean
          default: true
          description: |
            Whether to enable periodic health checks. When false, the system will not automatically
            verify authentication status, and `auto_reauth` has no effect on the automatic flow
            (since re-auth is only triggered by a failed scheduled health check). Defaults to true.
          example: true
        auto_reauth:
          type: boolean
          default: true
          description: |
            Whether to permit automatic re-authentication when a scheduled health check detects an
            expired session. This is an opt-in flag only — it does not check whether re-auth is
            actually feasible. Even when true, re-auth only runs when the system has what it needs
            to perform it (for example, saved credentials for the required login fields), and only
            after a scheduled health check detects an expired session — so this flag has no effect
            when `health_checks` is false. When false, expired sessions are marked as `NEEDS_AUTH`
            instead of attempting re-auth. Defaults to true.
          example: true
        save_credentials:
          type: boolean
          default: true
          description: Whether to save credentials after every successful login. Defaults to true. One-time codes (TOTP, SMS, etc.) are not saved.
          example: true
        record_session:
          type: boolean
          default: false
          description: Whether to record browser sessions for this connection by default. Useful for debugging. Can be overridden per-login. Defaults to false.
          example: false
        browser_telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          nullable: true
          deprecated: true
          description: Deprecated. Use browser.telemetry. Retained during migration for existing clients.
      additionalProperties: false
    ManagedAuthUpdateRequest:
      type: object
      description: Request to update an auth connection's configuration
      properties:
        login_url:
          type: string
          format: uri
          description: Login page URL. Set to empty string to clear.
          example: https://netflix.com/login
        credential:
          $ref: '#/components/schemas/CredentialReference'
        allowed_domains:
          type: array
          items:
            type: string
          description: Additional domains valid for this auth flow (replaces existing list)
          example:
            - login.netflix.com
            - auth.netflix.com
        health_check_interval:
          type: integer
          minimum: 300
          maximum: 86400
          description: Interval in seconds between automatic health checks
          example: 3600
        health_checks:
          type: boolean
          description: |
            Whether periodic health checks are enabled. When set to false, the system will not
            automatically verify authentication status, and `auto_reauth` has no effect on the
            automatic flow (since re-auth is only triggered by a failed scheduled health check).
          example: true
        auto_reauth:
          type: boolean
          description: |
            Whether automatic re-authentication is permitted for this connection. This is an opt-in
            flag only — it does not check whether re-auth is actually feasible. Even when true,
            re-auth only runs when the system has what it needs to perform it (for example, saved
            credentials for the required login fields), and only after a scheduled health check
            detects an expired session — so this flag has no effect when `health_checks` is false.
            When false, expired sessions detected by a health check are marked as `NEEDS_AUTH`
            instead of attempting re-auth.
          example: true
        save_credentials:
          type: boolean
          description: Whether to save credentials after every successful login
          example: true
        record_session:
          type: boolean
          description: Whether to record browser sessions for this connection by default
          example: false
        browser:
          $ref: '#/components/schemas/ManagedAuthBrowserConfig'
          description: Browser configuration updates for future login, reauthentication, and health-check sessions. Omitted properties remain unchanged.
        browser_telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          nullable: true
          deprecated: true
          description: Deprecated. Use browser.telemetry. Retained during migration for existing clients.
        proxy:
          $ref: '#/components/schemas/ProxyRef'
          deprecated: true
          description: Deprecated. Use browser.proxy. Retained during migration for existing clients.
      additionalProperties: false
    LoginRequest:
      type: object
      description: Request to start a login flow
      properties:
        browser:
          $ref: '#/components/schemas/ManagedAuthBrowserConfig'
          description: Browser configuration override for this login. Omitted properties inherit the connection defaults.
        proxy:
          $ref: '#/components/schemas/ProxyRef'
          deprecated: true
          description: Deprecated. Use browser.proxy. Retained during migration for existing clients.
        record_session:
          type: boolean
          description: Override the connection's default for recording this login's browser session. When omitted, the connection's record_session default is used.
          example: true
        browser_telemetry:
          $ref: '#/components/schemas/BrowserTelemetryRequestConfig'
          nullable: true
          deprecated: true
          description: Deprecated. Use browser.telemetry. Retained during migration for existing clients.
      additionalProperties: false
    LoginResponse:
      type: object
      description: Response from starting a login flow
      required:
        - id
        - flow_type
        - hosted_url
        - flow_expires_at
      properties:
        id:
          type: string
          description: Auth connection ID
          example: ma_abc123xyz
        flow_type:
          type: string
          enum:
            - LOGIN
            - REAUTH
          description: Type of login flow started
          example: LOGIN
        hosted_url:
          type: string
          format: uri
          description: URL to redirect user to for login
          example: https://auth.kernel.com/login/abc123xyz
        flow_expires_at:
          type: string
          format: date-time
          description: When the login flow expires
          example: "2025-11-05T20:00:00Z"
        handoff_code:
          type: string
          description: One-time code for handoff (internal use)
          example: aBcD123EfGh456IjKl789MnOp012QrStUvWxYzAbCdEf
        live_view_url:
          type: string
          format: uri
          description: Browser live view URL for watching the login flow
          example: https://live.onkernel.com/abc123xyz
      additionalProperties: false
    SubmitFieldsRequest:
      type: object
      description: Request to submit field values, click an SSO button, select an MFA method, or select a sign-in option. Prefer canonical selected_choice_id/field_values when the API returns fields/choices; legacy fields/sso_button_selector/sso_provider/mfa_option_id/sign_in_option_id remain supported during deprecation.
      properties:
        field_values:
          type: object
          additionalProperties:
            type: string
          description: Canonical map of field ID to submitted value.
          example:
            field_email: user@example.com
            field_password: secret
        selected_choice_id:
          type: string
          description: Canonical choice ID selected by the user.
          example: google
        fields:
          type: object
          additionalProperties:
            type: string
          description: Map of field name to value
          example:
            email: user@example.com
            password: secret
        sso_button_selector:
          type: string
          description: XPath selector for the SSO button to click (ODA). Use sso_provider instead for CUA.
          example: xpath=//button[contains(text(), 'Continue with Google')]
        sso_provider:
          type: string
          description: SSO provider to click, matching the provider field from pending_sso_buttons (e.g., "google", "github"). Cannot be used with sso_button_selector.
          example: google
        mfa_option_id:
          type: string
          description: The MFA method type to select (when mfa_options were returned)
          example: sms
        sign_in_option_id:
          type: string
          description: The sign-in option ID to select (when sign_in_options were returned)
          example: work-account
      additionalProperties: false
    SubmitFieldsResponse:
      type: object
      description: Response from submitting field values
      required:
        - accepted
      properties:
        accepted:
          type: boolean
          description: Whether the submission was accepted for processing
      additionalProperties: false
    Credential:
      type: object
      description: A stored credential for automatic re-authentication
      required:
        - id
        - name
        - domain
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the credential
          example: cred_abc123xyz
        name:
          type: string
          description: Unique name for the credential within the project
          example: my-netflix-login
        domain:
          type: string
          description: Target domain this credential is for
          example: netflix.com
        created_at:
          type: string
          format: date-time
          description: When the credential was created
          example: "2025-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the credential was last updated
          example: "2025-01-15T10:30:00Z"
        has_values:
          type: boolean
          description: Whether this credential has stored values (email, password, etc.)
          example: true
        has_totp_secret:
          type: boolean
          description: Whether this credential has a TOTP secret configured for automatic 2FA
          example: false
        value_keys:
          type: array
          items:
            type: string
          description: The field names stored in this credential's values (e.g., username, password). Values themselves are never returned. Included on single-credential responses (create, get by id or name, update); omitted from list responses.
          example:
            - username
            - password
        sso_provider:
          type: string
          nullable: true
          description: If set, indicates this credential should be used with the specified SSO provider (e.g., google, github, microsoft). When the target site has a matching SSO button, it will be clicked first before filling credential values on the identity provider's login page.
          example: google
        totp_code:
          type: string
          description: Current 6-digit TOTP code. Only included in create/update responses when totp_secret was just set.
          example: "847291"
        totp_code_expires_at:
          type: string
          format: date-time
          description: When the totp_code expires. Only included when totp_code is present.
          example: "2025-01-15T10:30:30Z"
      additionalProperties: false
    CreateCredentialRequest:
      type: object
      description: Request to create a new credential
      required:
        - name
        - domain
        - values
      properties:
        name:
          type: string
          description: Unique name for the credential within the project
          example: my-netflix-login
        domain:
          type: string
          description: Target domain this credential is for
          example: netflix.com
        values:
          type: object
          description: Field name to value mapping (e.g., username, password)
          additionalProperties:
            type: string
          example:
            username: user@example.com
            password: mysecretpassword
        totp_secret:
          type: string
          description: Base32-encoded TOTP secret for generating one-time passwords. Used for automatic 2FA during login.
          example: JBSWY3DPEHPK3PXP
        sso_provider:
          type: string
          description: If set, indicates this credential should be used with the specified SSO provider (e.g., google, github, microsoft). When the target site has a matching SSO button, it will be clicked first before filling credential values on the identity provider's login page.
          example: google
      additionalProperties: false
    UpdateCredentialRequest:
      type: object
      description: Request to update an existing credential
      properties:
        name:
          type: string
          description: New name for the credential
          example: my-updated-login
        values:
          type: object
          description: Field name to value mapping. Values are merged with existing values (new keys added, existing keys overwritten).
          additionalProperties:
            type: string
          example:
            username: user@example.com
            password: newpassword
        remove_value_keys:
          type: array
          items:
            type: string
          description: Field names to remove from the credential's stored values. Removals are applied before `values` are merged, so a key present in both is kept with its new value.
          example:
            - old_field
        totp_secret:
          type: string
          description: Base32-encoded TOTP secret for generating one-time passwords. Spaces and formatting are automatically normalized. Set to empty string to remove.
          example: JBSWY3DPEHPK3PXP
        sso_provider:
          type: string
          nullable: true
          description: If set, indicates this credential should be used with the specified SSO provider. Set to empty string or null to remove.
          example: google
      additionalProperties: false
    CredentialProvider:
      type: object
      description: An external credential provider (e.g., 1Password) for automatic credential lookup
      required:
        - id
        - provider_type
        - name
        - enabled
        - priority
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the credential provider
          example: credprov_abc123xyz
        provider_type:
          type: string
          description: Type of credential provider
          enum:
            - onepassword
          example: onepassword
        name:
          type: string
          description: Human-readable name for this provider instance
          example: my-1password
        enabled:
          type: boolean
          description: Whether the provider is enabled for credential lookups
          example: true
        priority:
          type: integer
          description: Priority order for credential lookups (lower numbers are checked first)
          example: 0
        created_at:
          type: string
          format: date-time
          description: When the credential provider was created
          example: "2025-01-15T10:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the credential provider was last updated
          example: "2025-01-15T10:30:00Z"
      additionalProperties: false
    CreateCredentialProviderRequest:
      type: object
      description: Request to create an external credential provider
      required:
        - provider_type
        - name
        - token
      properties:
        provider_type:
          type: string
          description: Type of credential provider
          enum:
            - onepassword
          example: onepassword
        name:
          type: string
          description: Human-readable name for this provider instance (unique per org)
          example: my-1password
        token:
          type: string
          description: Service account token for the provider (e.g., 1Password service account token)
          example: ops_eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        cache_ttl_seconds:
          type: integer
          description: How long to cache credential lists (default 300 seconds)
          default: 300
          example: 300
      additionalProperties: false
    UpdateCredentialProviderRequest:
      type: object
      description: Request to update a credential provider
      properties:
        name:
          type: string
          description: Human-readable name for this provider instance
          example: my-1password
        enabled:
          type: boolean
          description: Whether the provider is enabled for credential lookups
          example: true
        priority:
          type: integer
          description: Priority order for credential lookups (lower numbers are checked first)
          example: 0
        token:
          type: string
          description: New service account token (to rotate credentials)
          example: ops_eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        cache_ttl_seconds:
          type: integer
          description: How long to cache credential lists
          example: 300
      additionalProperties: false
    CredentialProviderItem:
      type: object
      description: A credential item from an external provider (e.g., a 1Password login item)
      required:
        - id
        - title
        - vault_id
        - vault_name
        - path
      properties:
        id:
          type: string
          description: Unique identifier for the item within the provider
          example: abc123xyz
        title:
          type: string
          description: Display name of the credential item
          example: Netflix Login
        vault_id:
          type: string
          description: ID of the vault containing this item
          example: vault_abc123
        vault_name:
          type: string
          description: Name of the vault containing this item
          example: Engineering
        path:
          type: string
          description: Path to reference this item (VaultName/ItemTitle format)
          example: Engineering/Netflix Login
        urls:
          type: array
          items:
            type: string
          description: URLs associated with this credential
          example:
            - https://netflix.com
            - https://www.netflix.com
      additionalProperties: false
    CredentialReference:
      type: object
      description: |
        Reference to credentials for the auth connection. Use one of:
        - { name } for Kernel credentials
        - { provider, path } for external provider item
        - { provider, auto: true } for external provider domain lookup
      properties:
        name:
          type: string
          description: Kernel credential name
          example: my-netflix-creds
        provider:
          type: string
          description: External provider name (e.g., "my-1p")
          example: my-1p
        path:
          type: string
          description: Provider-specific path (e.g., "VaultName/ItemName" for 1Password)
          example: Personal/Netflix
        auto:
          type: boolean
          description: If true, lookup by domain from the specified provider
          example: true
      additionalProperties: false
    CredentialProviderTestResult:
      type: object
      description: Result of testing a credential provider connection
      required:
        - success
        - vaults
      properties:
        success:
          type: boolean
          description: Whether the connection test was successful
          example: true
        vaults:
          type: array
          description: List of vaults accessible by the service account
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
                description: Vault ID
                example: abc123xyz
              name:
                type: string
                description: Vault name
                example: Shared Logins
        error:
          type: string
          description: Error message if the test failed
          example: Invalid token
      additionalProperties: false
    OkResponse:
      type: object
      description: Generic OK response.
      required:
        - ok
      properties:
        ok:
          type: boolean
          description: Indicates success.
          default: true
      additionalProperties: false
    Proxy:
      type: object
      description: Configuration for routing traffic through a proxy.
      required:
        - type
      properties:
        id:
          type: string
        name:
          type: string
          description: Readable name of the proxy.
        type:
          type: string
          description: |
            Proxy type to use. In terms of quality for avoiding bot-detection, from best to worst: `mobile` > `residential` > `isp` > `datacenter`.
          enum:
            - datacenter
            - isp
            - residential
            - mobile
            - custom
        protocol:
          type: string
          description: Protocol to use for the proxy connection.
          enum:
            - http
            - https
          default: https
        bypass_hosts:
          type: array
          description: Hostnames that should bypass the parent proxy and connect directly.
          items:
            type: string
        status:
          type: string
          description: Current health status of the proxy.
          enum:
            - available
            - unavailable
        last_checked:
          type: string
          format: date-time
          description: Timestamp of the last health check performed on this proxy.
        ip_address:
          type: string
          description: IP address that the proxy uses when making requests.
          example: 192.168.1.1
        config:
          description: Configuration specific to the selected proxy `type`.
          oneOf:
            - $ref: '#/components/schemas/DatacenterProxyConfig'
            - $ref: '#/components/schemas/IspProxyConfig'
            - $ref: '#/components/schemas/ResidentialProxyConfig'
            - $ref: '#/components/schemas/MobileProxyConfig'
            - $ref: '#/components/schemas/CustomProxyConfig'
      discriminator:
        propertyName: type
        mapping:
          datacenter: '#/components/schemas/DatacenterProxyConfig'
          isp: '#/components/schemas/IspProxyConfig'
          residential: '#/components/schemas/ResidentialProxyConfig'
          mobile: '#/components/schemas/MobileProxyConfig'
          custom: '#/components/schemas/CustomProxyConfig'
    ProxyCheckRequest:
      type: object
      description: Optional parameters for the proxy health check.
      properties:
        url:
          type: string
          example: https://example.com
          description: An optional URL to test reachability against. If provided, the proxy check will test connectivity to this URL instead of the default test URLs. Only HTTP and HTTPS schemes are allowed, and the URL must resolve to a public IP address. For ISP and datacenter proxies, the exit IP is stable, so a successful check reliably indicates that subsequent browser sessions will reach the target site with the same IP. For residential and mobile proxies, the exit node changes between requests, so a successful check validates proxy configuration but does not guarantee that a subsequent browser session will use the same exit IP or reach the same site — it is useful for verifying credentials and connectivity, not for predicting site-specific behavior. When provided, the check result does not update the proxy's health status, since a failure may indicate a problem with the target site rather than the proxy itself.
    ProxyUpdateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: New proxy name. Proxy names are trimmed and length-checked only; duplicates are allowed because proxies are updated by ID, not by name.
          minLength: 1
          maxLength: 255
          example: my-renamed-proxy
    ProxyCreateRequest:
      type: object
      description: Configuration for routing traffic through a proxy.
      required:
        - type
      properties:
        name:
          type: string
          description: Readable name of the proxy.
        type:
          type: string
          description: |
            Proxy type to use. In terms of quality for avoiding bot-detection, from best to worst: `mobile` > `residential` > `isp` > `datacenter`.
          enum:
            - datacenter
            - isp
            - residential
            - mobile
            - custom
        protocol:
          type: string
          description: Protocol to use for the proxy connection.
          enum:
            - http
            - https
          default: https
        bypass_hosts:
          type: array
          description: Hostnames that should bypass the parent proxy and connect directly.
          items:
            type: string
        config:
          description: Configuration specific to the selected proxy `type`.
          oneOf:
            - $ref: '#/components/schemas/DatacenterProxyConfig'
            - $ref: '#/components/schemas/IspProxyConfig'
            - $ref: '#/components/schemas/ResidentialProxyConfig'
            - $ref: '#/components/schemas/MobileProxyConfig'
            - $ref: '#/components/schemas/CreateCustomProxyConfig'
      discriminator:
        propertyName: type
        mapping:
          datacenter: '#/components/schemas/DatacenterProxyConfig'
          isp: '#/components/schemas/IspProxyConfig'
          residential: '#/components/schemas/ResidentialProxyConfig'
          mobile: '#/components/schemas/MobileProxyConfig'
          custom: '#/components/schemas/CustomProxyConfig'
    DatacenterProxyConfig:
      type: object
      title: Datacenter
      description: Configuration for a datacenter proxy.
      properties:
        country:
          type: string
          description: ISO 3166 country code. Defaults to US if not provided.
          example: US
    IspProxyConfig:
      type: object
      title: ISP
      description: Configuration for an ISP proxy.
      properties:
        country:
          type: string
          description: ISO 3166 country code. Defaults to US if not provided.
          example: US
    ResidentialProxyConfig:
      type: object
      title: Residential
      description: Configuration for residential proxies.
      properties:
        country:
          type: string
          description: ISO 3166 country code.
          example: US
        city:
          type: string
          description: City name (no spaces, e.g. `sanfrancisco`). If provided, `country` must also be provided.
          example: sanfrancisco
        state:
          type: string
          description: Two-letter state code.
          example: CA
        zip:
          type: string
          description: US ZIP code.
          example: "94107"
        asn:
          type: string
          description: Autonomous system number. See https://bgp.potaroo.net/cidr/autnums.html
          example: AS15169
        os:
          type: string
          description: Operating system of the residential device.
          deprecated: true
          x-deprecated-reason: os selection not supported by proxy provider
          enum:
            - windows
            - macos
            - android
    MobileProxyConfig:
      type: object
      title: Mobile
      description: Configuration for mobile proxies.
      properties:
        country:
          type: string
          description: ISO 3166 country code
          example: US
        city:
          type: string
          description: Provider city alias. Mobile carrier routing can make observed geo vary.
          example: brooklyn
        state:
          type: string
          description: US-only state code. Mobile carrier routing can make observed geo vary.
          example: NY
    CustomProxyConfig:
      type: object
      title: Custom
      description: Configuration for a custom proxy (e.g., private proxy server).
      required:
        - host
        - port
      properties:
        host:
          type: string
          description: Proxy host address or IP.
          example: 127.0.0.1
        port:
          type: integer
          description: Proxy port.
          example: 8080
        username:
          type: string
          description: Username for proxy authentication.
          example: user123
        has_password:
          type: boolean
          description: Whether the proxy has a password.
          example: true
        has_ca_bundle:
          type: boolean
          description: Whether the proxy has a custom CA bundle configured.
          example: true
    CreateCustomProxyConfig:
      type: object
      title: Custom
      description: Configuration for a custom proxy (e.g., private proxy server).
      required:
        - host
        - port
      properties:
        host:
          type: string
          description: Proxy host address or IP.
          example: 127.0.0.1
        port:
          type: integer
          description: Proxy port.
          example: 8080
        username:
          type: string
          description: Username for proxy authentication.
          example: user123
        password:
          type: string
          maxLength: 4096
          description: Password for proxy authentication.
          example: secret
        ca_bundle:
          type: string
          maxLength: 65536
          description: PEM-encoded CA certificate bundle the proxy re-signs upstream TLS with. Provide when the proxy terminates TLS (MITM) so the browser trusts its certificates. May contain multiple concatenated certificates.
          example: |
            -----BEGIN CERTIFICATE-----
            MIIB...
            -----END CERTIFICATE-----
    ClickMouseRequest:
      type: object
      required:
        - x
        - y
      properties:
        button:
          type: string
          description: Mouse button to interact with
          enum:
            - left
            - right
            - middle
            - back
            - forward
        click_type:
          type: string
          description: Type of click action
          enum:
            - down
            - up
            - click
        x:
          type: integer
          description: X coordinate of the click position
        y:
          type: integer
          description: Y coordinate of the click position
        hold_keys:
          type: array
          description: Modifier keys to hold during the click
          items:
            type: string
        num_clicks:
          type: integer
          description: Number of times to repeat the click
          default: 1
      additionalProperties: false
    MoveMouseRequest:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: integer
          description: X coordinate to move the cursor to
        y:
          type: integer
          description: Y coordinate to move the cursor to
        hold_keys:
          type: array
          description: Modifier keys to hold during the move
          items:
            type: string
        smooth:
          type: boolean
          description: Use human-like Bezier curve path instead of instant mouse movement.
          default: true
        duration_ms:
          type: integer
          description: Target total duration in milliseconds for the mouse movement when smooth=true. Omit for automatic timing based on distance.
          minimum: 50
          maximum: 5000
      additionalProperties: false
    MousePositionResponse:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: integer
          description: X coordinate of the cursor
        y:
          type: integer
          description: Y coordinate of the cursor
      additionalProperties: false
    ClipboardContent:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Current clipboard text content
      additionalProperties: false
    WriteClipboardRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Text to write to the system clipboard
      additionalProperties: false
    ScreenshotRegion:
      type: object
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: integer
          description: X coordinate of the region's top-left corner
        y:
          type: integer
          description: Y coordinate of the region's top-left corner
        width:
          type: integer
          description: Width of the region in pixels
        height:
          type: integer
          description: Height of the region in pixels
      additionalProperties: false
    ScreenshotRequest:
      type: object
      properties:
        region:
          $ref: '#/components/schemas/ScreenshotRegion'
      additionalProperties: false
    TypeTextRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: Text to type on the browser instance
        delay:
          type: integer
          description: Delay in milliseconds between keystrokes
          minimum: 0
          default: 0
      additionalProperties: false
    PressKeyRequest:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          description: |
            List of key symbols to press. Each item should be a key symbol supported by xdotool
            (see X11 keysym definitions). Examples include "Return", "Shift", "Ctrl", "Alt", "F5".
            Items in this list could also be combinations, e.g. "Ctrl+t" or "Ctrl+Shift+Tab".
          items:
            type: string
        duration:
          type: integer
          description: Duration to hold the keys down in milliseconds. If omitted or 0, keys are tapped.
          minimum: 0
          default: 0
        hold_keys:
          type: array
          description: Optional modifier keys to hold during the key press sequence.
          items:
            type: string
      additionalProperties: false
    ScrollRequest:
      type: object
      required:
        - x
        - y
      properties:
        x:
          type: integer
          description: X coordinate at which to perform the scroll
        y:
          type: integer
          description: Y coordinate at which to perform the scroll
        delta_x:
          type: integer
          description: Horizontal scroll amount in xdotool "wheel units." Positive scrolls right, negative scrolls left.
          default: 0
        delta_y:
          type: integer
          description: Vertical scroll amount in xdotool "wheel units." Positive scrolls down, negative scrolls up.
          default: 0
        hold_keys:
          type: array
          description: Modifier keys to hold during the scroll
          items:
            type: string
      additionalProperties: false
    DragMouseRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: array
          description: Ordered list of [x, y] coordinate pairs to move through while dragging. Must contain at least 2 points.
          minItems: 2
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: integer
        button:
          type: string
          description: Mouse button to drag with
          enum:
            - left
            - middle
            - right
        delay:
          type: integer
          description: Delay in milliseconds between button down and starting to move along the path.
          minimum: 0
          default: 0
        steps_per_segment:
          type: integer
          description: Number of relative move steps per segment in the path. Minimum 1.
          minimum: 1
          default: 10
        step_delay_ms:
          type: integer
          description: Delay in milliseconds between relative steps while dragging (not the initial delay).
          minimum: 0
          default: 50
        hold_keys:
          type: array
          description: Modifier keys to hold during the drag
          items:
            type: string
        smooth:
          type: boolean
          description: Use human-like Bezier curves between path waypoints instead of linear interpolation. When true, steps_per_segment and step_delay_ms are ignored.
          default: true
        duration_ms:
          type: integer
          description: Target total duration in milliseconds for the entire drag movement when smooth=true. Omit for automatic timing based on total path length.
          minimum: 50
          maximum: 10000
      additionalProperties: false
    SetCursorRequest:
      type: object
      required:
        - hidden
      properties:
        hidden:
          type: boolean
          description: Whether the cursor should be hidden or visible
      additionalProperties: false
    SleepAction:
      type: object
      description: Pause execution for a specified duration.
      required:
        - duration_ms
      properties:
        duration_ms:
          type: integer
          description: Duration to sleep in milliseconds.
          minimum: 0
          maximum: 30000
      additionalProperties: false
    ComputerAction:
      type: object
      description: |
        A single computer action to execute as part of a batch. The `type` field selects which
        action to perform, and the corresponding field contains the action parameters.
        Exactly one action field matching the type must be provided.
      required:
        - type
      properties:
        type:
          type: string
          description: The type of action to perform.
          enum:
            - click_mouse
            - move_mouse
            - type_text
            - press_key
            - scroll
            - drag_mouse
            - set_cursor
            - sleep
        click_mouse:
          $ref: '#/components/schemas/ClickMouseRequest'
        move_mouse:
          $ref: '#/components/schemas/MoveMouseRequest'
        type_text:
          $ref: '#/components/schemas/TypeTextRequest'
        press_key:
          $ref: '#/components/schemas/PressKeyRequest'
        scroll:
          $ref: '#/components/schemas/ScrollRequest'
        drag_mouse:
          $ref: '#/components/schemas/DragMouseRequest'
        set_cursor:
          $ref: '#/components/schemas/SetCursorRequest'
        sleep:
          $ref: '#/components/schemas/SleepAction'
      additionalProperties: false
    BatchComputerActionRequest:
      type: object
      description: A batch of computer actions to execute sequentially.
      required:
        - actions
      properties:
        actions:
          type: array
          description: Ordered list of actions to execute. Execution stops on the first error.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ComputerAction'
      additionalProperties: false
    ApiKeyCreator:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          description: Kernel user ID of the creator.
          example: user-abc123
        email:
          type: string
          format: email
          description: Email address of the creator.
          example: user@example.com
        name:
          type: string
          nullable: true
          description: Display name of the creator, if available.
          example: Jane Doe
    ApiKey:
      type: object
      required:
        - id
        - name
        - created_at
        - created_by
        - expires_at
        - deleted_at
        - project_id
        - project_name
        - masked_key
      properties:
        id:
          type: string
          description: Unique API key identifier
          example: ckv9w8q2f000001l5r3j7k9m4
        name:
          type: string
          description: Label for the API key. API keys are not addressable by name; use the ID or key identifier for stable references.
          example: production
        created_at:
          type: string
          format: date-time
          description: When the API key was created
        created_by:
          $ref: '#/components/schemas/ApiKeyCreator'
        expires_at:
          type: string
          format: date-time
          description: When the API key expires
          nullable: true
        deleted_at:
          type: string
          format: date-time
          description: When the API key was deleted (soft-deleted). Null for keys that have not been deleted.
          nullable: true
        project_id:
          type: string
          description: Project identifier for project-scoped API keys. Null means org-wide.
          example: proj_abc123
          nullable: true
        project_name:
          type: string
          description: Project name for project-scoped API keys. Null means the key is org-wide or the project name is unavailable.
          example: Production
          nullable: true
        masked_key:
          type: string
          description: Masked version of the API key
          example: sk_1234...abcd
    CreatedApiKey:
      description: API key returned immediately after creation. Includes the plaintext key once.
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required:
            - key
          properties:
            key:
              type: string
              description: Plaintext API key. Only returned once when the key is created.
              example: sk_1234abcd
    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Label for the API key (1-255 characters). API keys are not addressable by name.
          minLength: 1
          maxLength: 255
          example: staging
        days_to_expire:
          type: integer
          description: Number of days until expiry, up to 3650. Use null for never.
          minimum: 1
          maximum: 3650
          example: 30
          nullable: true
        project_id:
          type: string
          description: Unique project identifier
          example: proj_abc123
          nullable: true
    UpdateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: New API key name
          minLength: 1
          maxLength: 255
          example: new-api-name
    RotateApiKeyRequest:
      type: object
      properties:
        days_to_expire:
          type: integer
          description: Lifetime in days for the new key, up to 3650. Omit to reuse the rotated key's original lifetime, or never-expires if it had none.
          minimum: 1
          maximum: 3650
          example: 30
          nullable: true
        expire_in_days:
          type: integer
          description: Grace period in days before the rotated key expires. Use 0 to expire it immediately. Omit for the default grace period of 7 days.
          minimum: 0
          maximum: 3650
          example: 7
          nullable: true
    AuditLogExportDestination:
      type: object
      description: |-
        An organization-scoped audit log export destination.

        Delivery is at-least-once for rows visible when their window is committed: a delivery that is retried rewrites the same object, and the same `event_id` can appear in more than one object, so consumers must deduplicate on `event_id`. Each event-time window is held for ten minutes before it commits; a row that becomes visible after its window is committed may not be delivered.

        Objects are written as `<prefix>/destination_id=<destination>/org_id=<org>/date=<YYYY-MM-DD>/hour=<HH>/<window>-<chunk>.jsonl.gz`, where `date` and `hour` are the UTC calendar hour that fully contains every row in the object, so the layout is safe to register as a Hive-partitioned table. The object name is derived from the rows it holds, so a retried delivery rewrites its own object.
      required:
        - id
        - type
        - region
        - bucket
        - prefix
        - role_arn
        - external_id
        - kernel_role_arn
        - format
        - status
        - consecutive_failures
        - created_at
        - updated_at
      properties:
        id:
          type: string
          maxLength: 128
          readOnly: true
          x-go-type-skip-optional-pointer: true
        type:
          type: string
          enum:
            - s3
        region:
          type: string
          minLength: 1
          maxLength: 128
        bucket:
          type: string
          minLength: 3
          maxLength: 63
        prefix:
          type: string
          maxLength: 512
        role_arn:
          type: string
          minLength: 1
          maxLength: 2048
        external_id:
          type: string
          maxLength: 128
          readOnly: true
          x-go-type-skip-optional-pointer: true
        kernel_role_arn:
          type: string
          maxLength: 2048
          description: |-
            The Kernel role that assumes `role_arn` in your account to deliver logs. Allow this role as the principal in your role's trust policy, and require `external_id` as the `sts:ExternalId` condition.

            Recreating a destination issues a new `external_id`, which the trust policy has to be updated to match.
          readOnly: true
          x-go-type-skip-optional-pointer: true
        kms_key_id:
          type: string
          maxLength: 2048
        format:
          type: string
          enum:
            - jsonl.gz
        status:
          type: string
          enum:
            - active
            - paused
          description: Pausing prevents new delivery attempts. An S3 upload already in progress may complete after the pause response; its rows can appear again after the destination is resumed.
        last_exported_cursor:
          type: string
          description: |-
            Opaque, versioned checkpoint for forward-only continuous export. This value is not compatible with audit-log list page tokens.

            Delivery starts at the moment the destination is activated, so events recorded before that are not delivered. Pausing stops delivery and resuming starts again from the time of the resume: events recorded while a destination was paused are never exported, and pausing is not a way to defer delivery.
          readOnly: true
        last_success_at:
          type: string
          format: date-time
          readOnly: true
        last_error:
          type: string
          description: Sanitized description of the most recent delivery failure.
          readOnly: true
        last_error_at:
          type: string
          format: date-time
          readOnly: true
        consecutive_failures:
          type: integer
          minimum: 0
          readOnly: true
          x-go-type-skip-optional-pointer: true
          x-omitempty: false
        next_attempt_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          x-go-type-skip-optional-pointer: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          x-go-type-skip-optional-pointer: true
      additionalProperties: false
    CreateAuditLogExportDestinationRequest:
      type: object
      required:
        - type
        - region
        - bucket
        - prefix
        - role_arn
        - format
      properties:
        type:
          type: string
          enum:
            - s3
        region:
          type: string
