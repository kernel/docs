        status:
          type: string
          enum:
            - active
            - paused
      additionalProperties: false
    AuditLogExportDestinationTestResult:
      type: object
      required:
        - success
        - stage
      properties:
        success:
          type: boolean
        stage:
          type: string
          enum:
            - assume_role
            - put_object
            - complete
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - assume_role_failed
                - put_object_failed
            message:
              type: string
          additionalProperties: false
      additionalProperties: false
    AuditLogEntry:
      type: object
      required:
        - timestamp
        - auth_strategy
        - user_id
        - email
        - status
        - method
        - path
        - route
        - domain
        - duration_ms
        - client_ip
        - user_agent
      properties:
        timestamp:
          type: string
          format: date-time
          description: UTC time when the request was received.
        auth_strategy:
          type: string
          description: Authentication strategy used for the request.
        user_id:
          type: string
          description: ID of the authenticated user, if any.
        email:
          type: string
          description: Email of the authenticated user at request time, if any.
        status:
          type: integer
          description: HTTP response status code.
        method:
          type: string
          description: HTTP method.
        path:
          type: string
          description: Request path.
        route:
          type: string
          description: Matched API route pattern, if available.
        domain:
          type: string
          description: Request host.
        duration_ms:
          type: integer
          description: Request duration in milliseconds.
        client_ip:
          type: string
          description: Client IP address.
        user_agent:
          type: string
          description: User agent header.
    Project:
      type: object
      required:
        - id
        - name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique project identifier
          example: proj_abc123
        name:
          type: string
          description: Project name
          example: production
        status:
          type: string
          enum:
            - active
            - archived
          description: Project status
          example: active
        created_at:
          type: string
          format: date-time
          description: When the project was created
        updated_at:
          type: string
          format: date-time
          description: When the project was last updated
    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Project name (1-255 Unicode code points)
          minLength: 1
          maxLength: 255
          example: staging
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
          description: New project name (1-255 Unicode code points)
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum:
            - active
            - archived
          description: New project status
    ProjectLimits:
      type: object
      properties:
        max_concurrent_sessions:
          type: integer
          nullable: true
          description: Maximum concurrent browsers for this project, covering both on-demand sessions (`browsers.create()`) and browser pool reservations. Null means no project-level cap.
          example: 10
        max_concurrent_invocations:
          type: integer
          nullable: true
          description: Maximum concurrent app invocations for this project. Null means no project-level cap.
          example: 20
        max_pooled_sessions:
          type: integer
          nullable: true
          deprecated: true
          description: 'Deprecated: pooled browsers now count toward `max_concurrent_sessions`. Always null.'
          example: 50
    UpdateProjectLimitsRequest:
      type: object
      properties:
        max_concurrent_sessions:
          type: integer
          nullable: true
          description: Maximum concurrent browsers for this project, covering both on-demand sessions and browser pool reservations. Set to 0 to remove the cap; omit to leave unchanged.
        max_concurrent_invocations:
          type: integer
          nullable: true
          description: Maximum concurrent app invocations for this project. Set to 0 to remove the cap; omit to leave unchanged.
        max_pooled_sessions:
          type: integer
          nullable: true
          deprecated: true
          description: 'Deprecated: pooled browsers now count toward `max_concurrent_sessions`. Requests that set this field are rejected with a 400.'
    OrgLimits:
      type: object
      properties:
        max_concurrent_sessions:
          type: integer
          description: The organization's effective concurrency limit — the maximum browsers running at once, covering both on-demand sessions and browser pool reservations — from its plan or an override. Read-only and shared across all projects in the org; a per-project default cannot exceed it.
          example: 500
        default_project_max_concurrent_sessions:
          type: integer
          nullable: true
          description: Default maximum concurrent browsers applied to every project that has no explicit per-project override. Null means no org-level default, so such projects are uncapped (only the org-wide limit applies). Applies to existing and newly created projects.
          example: 10
    UpdateOrgLimitsRequest:
      type: object
      properties:
        default_project_max_concurrent_sessions:
          type: integer
          nullable: true
          description: Default maximum concurrent browsers for projects without an explicit override. Set to 0 to remove the default; omit to leave unchanged. Cannot exceed the organization's concurrency limit.
