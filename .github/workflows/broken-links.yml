name: Check Broken Links

on:
  pull_request:
  push:
    branches: [main]

jobs:
  broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mintlify CLI
        # Pinned: 4.2.931 can't install, its @mintlify/auth-edge dependency is unpublished
        run: npm install -g mint@4.2.930

      - name: Check for broken links
        run: mint broken-links
