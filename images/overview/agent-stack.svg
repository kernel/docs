<text x="64" y="72" font-size="18" fill="#1c2024" text-anchor="start" font-weight="400">agent framework or harness</text>
<text x="64" y="96" font-size="14" fill="#60646c" text-anchor="start" font-weight="400">runs the loop: ask the model, run the tool it picks, repeat</text>
