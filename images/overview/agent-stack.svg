<text x="660" y="138" font-size="13" fill="#60646c" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">claude, gpt, gemini</text>
<text x="640" y="188" font-size="13" fill="#60646c" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">claude agent sdk, vercel ai sdk,</text>
<text x="640" y="208" font-size="13" fill="#60646c" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">browser use, mastra</text>
<rect x="150" y="260" width="410" height="80" fill="#ffffff" stroke="#1c2024"/>
<text x="174" y="292" font-size="18" fill="#1c2024" text-anchor="start" font-weight="400">browser automation framework</text>
<text x="174" y="316" font-size="14" fill="#60646c" text-anchor="start" font-weight="400">turns a tool call into page actions</text>
<text x="640" y="296" font-size="13" fill="#60646c" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">playwright, puppeteer,</text>
<text x="640" y="316" font-size="13" fill="#60646c" text-anchor="start" font-weight="400" font-family="IBM Plex Mono, SFMono-Regular, Menlo, Consolas, monospace">stagehand, agent browser</text>
<rect x="40" y="410" width="520" height="90" fill="#81b300" stroke="#1c2024"/>
<text x="64" y="444" font-size="18" fill="#1c2024" text-anchor="start" font-weight="400">browser infrastructure: KERNEL</text>
<text x="64" y="470" font-size="14" fill="#1c2024" text-anchor="start" font-weight="400">runs the browser: its vm, stealth, proxies, logins, payments</text>
<rect x="40" y="570" width="520" height="50" fill="#ffffff" stroke="#1c2024"/>
<text x="64" y="601" font-size="16" fill="#1c2024" text-anchor="start" font-weight="400">the website</text>
